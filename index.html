    var themeMeta = {
      dark: "低光环境更舒适",
      light: "白天显示更清晰",
      system: "随设备自动切换"
    };
    var themeOptions = ["dark", "light", "system"]
      .map(function (key) {
        var preview =
          key === "system"
            ? '<span class="theme-preview theme-preview-system" aria-hidden="true"><span><i></i><i></i></span><span><i></i><i></i></span></span>'
            : '<span class="theme-preview theme-preview-' + key + '" aria-hidden="true"><i></i><i></i><i></i></span>';
        return (
          '<button class="theme-option' +
          (state.theme === key ? " active" : "") +
          '" data-act="theme" data-value="' +
          key +
          '" data-theme-value="' + key +
          '" aria-pressed="' + (state.theme === key ? "true" : "false") + '">' +
          preview +
          '<span class="theme-copy"><b>' + themeNames[key] + "</b><small>" +
          themeMeta[key] +
          '</small></span><span class="theme-check" aria-hidden="true">✓</span></button>'
        );
      })
      .join("");
    return (
      '<section class="card"><h3>外观</h3>' +
      '<div class="theme-options" data-theme-pick>' +
      themeOptions +
      "</div>" +
      '<p class="muted small">现在是' +
      esc(themeNames[state.theme] || "跟随系统") +
      (state.theme === "system" ? "（当前系统是" + (resolvedTheme() === "dark" ? "深色" : "浅色") + "）" : "") +
      "。</p></section>" +
      '<section class="card"><h3>每日提醒</h3>' +
      '<p class="muted small">浏览器通知在页面打开或退到后台时提醒。完全关闭浏览器后，网页无法保证定时通知；需要关掉页面也提醒时，请使用「添加到系统日历」。iPhone 需先将网站添加到主屏幕并允许通知。</p>' +
      '<div class="reminder-row">' +
      '<button class="btn ' + (state.reminder.enabled ? "primary" : "ghost") + '" data-act="toggle-reminder">' +
      (state.reminder.enabled ? "每日提醒已开启" : "开启每日提醒") +
      "</button>" +
      '<div class="time-field"><span>提醒时间</span>' +
      '<button class="btn ghost time-value" data-act="pick-reminder-time" aria-haspopup="dialog">' +
      esc(state.reminder.time) +
      "</button></div>" +
      "</div>" +
      '<p class="muted small">通知权限：' +
      esc(
        reminderPermission() === "granted"
          ? "已允许"
          : reminderPermission() === "denied"
            ? "已拒绝，可在浏览器设置中重新开启"
            : "尚未授权"
      ) +
      "。连续多日未打卡时，会优先提醒最近断档最多的目标。</p>" +
      '<div class="actions"><button class="btn ghost small-btn" data-act="test-reminder">测试提醒</button>' +
      '<button class="btn ghost small-btn" data-act="calendar-reminder">添加到系统日历</button></div></section>' +
      '<section class="card"><h3>我的自律标语</h3>' +
      '<p class="muted small">首页每天轮换一句标语。你可以写自己的，它们会和内置标语一起出现，也会出现在冲动急救的呼吸引导里。</p>' +
      '<div class="actions"><button class="btn ghost" data-act="manage-slogans">管理我的标语' +
      (state.slogans.length ? "（" + state.slogans.length + " 句）" : "") +
      "</button></div></section>" +
      '<section class="card"><h3>数据</h3>' +
      '<p class="muted small">' + state.habits.length + " 个目标 · " + urgeCount + " 条冲动记录 · 本地占用约 " + Math.max(1, Math.round(raw.length / 1024)) + " KB</p>" +
      '<div class="actions">' +
      '<button class="btn ghost" data-act="export">导出备份（JSON）</button>' +
      '<button class="btn ghost" data-act="import">从备份恢复</button>' +
      '<button class="btn danger" data-act="clear">清空所有数据</button>' +
      "</div></section>" +
      '<section class="card"><h3>关于</h3>' +
      '<p class="muted small">数据只保存在这台设备的浏览器里，不上传、不联网。清空浏览器数据会一并删掉记录，建议定期导出备份。</p>' +
      '<p class="muted small">提醒：这里的时间线来自公开的健康科普资料，仅供参考，不能替代医生的诊断和治疗建议。如果戒断时出现明显不适（比如严重心慌、手抖、出汗、幻觉），请及时就医。</p>' +
      "</section>"
    );
  }

  function viewHTML() {
    if (state.view === "detail") {
      var habit = getHabit(state.activeId);
      if (habit) return detailHTML(habit);
    }
    if (state.view === "month") return monthHTML();
    if (state.view === "year") return yearHTML();
    if (state.view === "settings") return settingsHTML();
    return homeHTML();
  }

  function capturePageTransitionLayer(motion) {
    if (motion !== "sheet-forward" && motion !== "sheet-back") return null;
    var current = $(".main");
    if (!current) return null;
    var rect = current.getBoundingClientRect();
    var layer = document.createElement("div");
    layer.className = "page-transition-layer " + (motion === "sheet-back" ? "is-over" : "is-under");
    layer.style.left = rect.left + "px";
    layer.style.top = rect.top + "px";
    layer.style.width = rect.width + "px";
    layer.style.height = rect.height + "px";
    layer.setAttribute("aria-hidden", "true");
    var clone = current.cloneNode(true);
    clone.classList.remove("anim-in", "page-forward", "page-back", "page-sheet-forward", "page-sheet-back");
    clone.style.width = "100%";
    clone.style.minHeight = rect.height + "px";
    layer.appendChild(clone);
    document.body.appendChild(layer);
    window.requestAnimationFrame(function () {
      window.requestAnimationFrame(function () {
        layer.classList.add(motion === "sheet-forward" ? "is-receding" : "is-exiting-down");
      });
    });
    window.setTimeout(function () {
      if (layer.parentNode) layer.parentNode.removeChild(layer);
    }, 620);
    return layer;
  }

  function render(resetScroll) {
    var theme = resolvedTheme();
    document.documentElement.setAttribute("data-theme", theme);
    // 让手机状态栏的颜色跟着主题走，避免顶部出现一条对不上的色块
    var themeColor = document.getElementById("themeColor");
    if (themeColor) themeColor.setAttribute("content", theme === "light" ? "#f4f6fa" : "#0e1116");
    var statusBar = document.getElementById("statusBarStyle");
    if (statusBar) statusBar.setAttribute("content", theme === "light" ? "default" : "black-translucent");
    var y = window.scrollY;
    var viewKey = state.view + ":" + (state.view === "detail" ? state.activeId || "" : "");
    var changed = viewKey !== ui.lastViewKey;
    var motion = changed ? ui.pageMotion : null;
    if (changed && !reduceMotion()) capturePageTransitionLayer(motion);
    $("#app").innerHTML = topbarHTML() + '<main class="main">' + viewHTML() + "</main>" + tabbarHTML();
    setupTabbar();
    scheduleContinuousCornersFallback();

    // 换页时内容错落着进场，方向跟着底部导航走
    ui.lastViewKey = viewKey;
    if ((changed || ui.forceAnim) && !reduceMotion()) {
      var main = $(".main");
      if (main) {
        var pageClass =
          motion === "sheet-back"
            ? "page-sheet-back"
            : motion === "sheet-forward"
              ? "page-sheet-forward"
              : motion === "back"
                ? "page-back"
                : motion === "forward"
                  ? "page-forward"
                  : "anim-in";
        main.classList.add(pageClass);
        window.setTimeout(function () {
          if (main.isConnected) main.classList.remove("anim-in", "page-forward", "page-back", "page-sheet-forward", "page-sheet-back");
        }, 520);
      }
    }
    ui.pageMotion = null;
    ui.forceAnim = false;
    ui.pulse = null;
    ui.sloganAnim = false;

    // 底栏是刚重建的，让液态玻璃重新贴一次（没装 glass.js 也不会报错）
    if (window.LiquidGlass && window.LiquidGlass.refresh) window.LiquidGlass.refresh();

    window.scrollTo(0, resetScroll ? 0 : y);
    scheduleReminderTimer();
  }

  /* ==================== 连续圆角回退 ==================== */

  var continuousCornerTimer = null;
  var continuousCornerObserver = null;
  var continuousCornerResize = null;
  var continuousCornerSelector = [
    ".card",
    ".btn",
    ".icon-btn",
    ".row-habit",
    ".row-tile",
    ".option-module",
    ".theme-option",
    ".theme-preview",
    ".sum",
    ".record-stat",
    ".record-item",
    ".record-empty",
    ".reminder-banner",
    ".tip",
    ".modal",
    ".list",
    ".list-row",
    ".seg",
    ".seg-btn",
    ".chip",
    ".field input:not([type='range']):not([type='checkbox'])",
    ".field textarea",
    ".field select",
    ".day",
    ".progress",
    ".progress-bar",
    ".mini",
    "#toast"
  ].join(",");

  function supportsNativeContinuousCorners() {
    return !!(window.CSS && CSS.supports && CSS.supports("corner-shape", "superellipse(2)"));
  }

  function superellipseClipPath(width, height, radius) {
    var r = Math.min(radius, width / 2, height / 2);
    if (r <= 0) return "";
    var steps = Math.max(5, Math.min(12, Math.ceil(r / 3)));
    var power = 1;
    var points = [];
    function point(x, y) {
      points.push(Math.round(x * 100) / 100 + " " + Math.round(y * 100) / 100);
    }
    point(r, 0);
    point(width - r, 0);
    for (var i = 1; i <= steps; i++) {
      var t = (i / steps) * (Math.PI / 2);
      point(width - r + r * Math.pow(Math.sin(t), power), r - r * Math.pow(Math.cos(t), power));
    }
    point(width, height - r);
    for (var j = 1; j <= steps; j++) {
      var u = (j / steps) * (Math.PI / 2);
      point(width - r + r * Math.pow(Math.cos(u), power), height - r + r * Math.pow(Math.sin(u), power));
    }
    point(r, height);
    for (var k = 1; k <= steps; k++) {
      var v = Math.PI / 2 - (k / steps) * (Math.PI / 2);
      point(r - r * Math.pow(Math.cos(v), power), height - r + r * Math.pow(Math.sin(v), power));
    }
    point(0, r);
    for (var m = 1; m <= steps; m++) {
      var z = (m / steps) * (Math.PI / 2);
      point(r - r * Math.pow(Math.cos(z), power), r - r * Math.pow(Math.sin(z), power));
    }
    return "path('M " + points[0].replace(" ", " ") + " L " + points.slice(1).join(" L ") + " Z')";
  }

  function applyContinuousCornerToElement(el) {
    if (!el || !el.isConnected) return;
    var rect = el.getBoundingClientRect();
    if (rect.width < 2 || rect.height < 2) return;
    var style = getComputedStyle(el);
    var radius = parseFloat(style.borderTopLeftRadius) || 0;
    if (radius <= 0) return;
    el.style.clipPath = superellipseClipPath(rect.width, rect.height, radius);
    el.style.webkitClipPath = el.style.clipPath;
    if (continuousCornerResize) continuousCornerResize.observe(el);
  }

  function applyContinuousCornersFallback() {
    if (supportsNativeContinuousCorners()) return;
    $$(continuousCornerSelector).forEach(applyContinuousCornerToElement);
  }

  function scheduleContinuousCornersFallback() {
    if (supportsNativeContinuousCorners()) return;
    clearTimeout(continuousCornerTimer);
    continuousCornerTimer = setTimeout(applyContinuousCornersFallback, 20);
  }

  window.JieyinContinuousCorners = {
    path: superellipseClipPath,
    apply: applyContinuousCornersFallback
  };

  if (!supportsNativeContinuousCorners()) {
    if (window.ResizeObserver) {
      continuousCornerResize = new ResizeObserver(function (entries) {
        entries.forEach(function (entry) {
          applyContinuousCornerToElement(entry.target);
        });
      });
    }
    continuousCornerObserver = new MutationObserver(scheduleContinuousCornersFallback);
    continuousCornerObserver.observe(document.body, { childList: true, subtree: true });
    window.addEventListener("resize", scheduleContinuousCornersFallback);
  }

  /* ==================== 数据导入导出 ==================== */

  function exportData() {
    var payload = {
      app: "jieyin",
      version: 1,
      exportedAt: new Date().toISOString(),
      theme: state.theme,
      habits: state.habits,
      slogans: state.slogans,
      reminder: state.reminder
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = "jieyin-backup-" + L.dayKey(Date.now()) + ".json";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
    toast("备份已导出");
  }

  function importData() {
    var input = document.createElement("input");
    input.type = "file";
    input.accept = "application/json,.json";
    input.addEventListener("change", function () {
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var data;
        try {
          data = JSON.parse(String(reader.result));
        } catch (err) {
          toast("这个文件不是有效的备份");
          return;
        }
        if (!data || !Array.isArray(data.habits)) {
          toast("备份格式不对，缺少 habits 字段");
          return;
        }
        if (!window.confirm("导入会覆盖当前所有记录，确定继续吗？")) return;
        state.habits = data.habits.map(normalizeHabit);
        if (data.theme === "light" || data.theme === "dark" || data.theme === "system") {
          state.theme = data.theme;
        }
        if (Array.isArray(data.slogans)) state.slogans = normalizeSlogans(data.slogans);
        if (data.reminder) state.reminder = normalizeReminder(data.reminder);
        state.activeId = state.habits.length ? state.habits[0].id : null;
        state.view = "home";
        save();
        render(true);
        toast("已恢复 " + state.habits.length + " 个目标");
      };
      reader.readAsText(file);
    });
    input.click();
  }

  function clearAll() {
    if (!window.confirm("确定要清空所有记录吗？这个操作无法撤销，建议先导出备份。")) return;
    if (!window.confirm("再确认一次：所有戒断计时、冲动与复吸记录都会被删除。")) return;
    state = emptyState();
    save();
    render(true);
    toast("已清空");
  }

  /* ==================== 事件 ==================== */

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");
    var id = el.getAttribute("data-id");

    if (act === "nav") {
      // 刚刚是用拖的，别让抬手时那次点击又跳一次
      if (ui.suppressTabClick && Date.now() < ui.suppressTabClick && el.classList.contains("tab-btn")) return;
      if (el.classList.contains("tab-btn")) tapFeedback();
      goTo(el.getAttribute("data-view"), el.getAttribute("data-view") === "detail" ? id : undefined);
      return;
    }
    if (act === "theme") {
      state.theme = el.getAttribute("data-value") || "system";
      save();
      render();
      return;
    }
    if (act === "new-habit") {
      if ($(".overlay")) return; // 已经有弹窗开着，别叠第二层
      var presetKey = el.getAttribute("data-key");
      if (presetKey) openHabitForm(null, presetKey);
      else openPresetPicker();
      return;
    }
    if (act === "edit-habit") {
      openHabitForm(id);
      return;
    }
    if (act === "open-habit") {
      goTo("detail", id);
      return;
    }
    if (act === "toggle-checkin") {
      toggleCheckin(id);
      return;
    }
    if (act === "toggle-day") {
      toggleDay(id, el.getAttribute("data-key"));
      return;
    }
    if (act === "next-slogan") {
      ui.sloganOffset += 1;
      ui.sloganAnim = true;
      render();
      return;
    }
    if (act === "pick-habit") {
      state.activeId = id;
      save();
      render();
      return;
    }
    if (act === "month-prev" || act === "month-next") {
      var step = act === "month-prev" ? -1 : 1;
      ui.monthCursor = L.shiftMonth(cursorMonth().year, cursorMonth().month, step);
      render(true);
      return;
    }
    if (act === "month-now") {
      ui.monthCursor = null;
      render(true);
      return;
    }
    if (act === "year-prev" || act === "year-next") {
      ui.yearCursor = cursorYear() + (act === "year-prev" ? -1 : 1);
      render(true);
      return;
    }
    if (act === "year-now") {
      ui.yearCursor = null;
      render(true);
      return;
    }
    if (act === "goto-month") {
      ui.monthCursor = { year: cursorYear(), month: Number(el.getAttribute("data-month")) };
      goTo("month");
      return;
    }
    if (act === "toggle-milestones") {
      ui.milestonesOpen = !ui.milestonesOpen;
      render();
      return;
    }
    if (act === "manage-slogans") {
      openSloganManager();
      return;
    }
    if (act === "open-records") {
      openRecords(id);
      return;
    }
    if (act === "toggle-reminder") {
      toggleReminder();
      return;
    }
    if (act === "pick-reminder-time") {
      openReminderTimePicker();
      return;
    }
    if (act === "test-reminder") {
      testReminderNow();
      return;
    }
    if (act === "calendar-reminder") {
      downloadCalendarReminder();
      return;
    }
    if (act === "sos") {
      openSOS(id);
      return;
    }
    if (act === "open-relapse") {
      openRelapse(id);
      return;
    }
    if (act === "delete-habit") {
      var habit = getHabit(id);
      if (habit && window.confirm("删除「" + habit.name + "」？所有计时与记录都会一起消失。")) deleteHabit(id);
      return;
    }
    if (act === "export") {
      exportData();
      return;
    }
    if (act === "import") {
      importData();
      return;
    }
    if (act === "clear") {
      clearAll();
      return;
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeTopModal();
  });

  var lastDayKey = L.dayKey(Date.now());
  if (systemTheme) {
    var onSystemThemeChange = function () {
      if (state.theme === "system") render();
    };
    if (systemTheme.addEventListener) systemTheme.addEventListener("change", onSystemThemeChange);
    else if (systemTheme.addListener) systemTheme.addListener(onSystemThemeChange);
  }

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var bar = $(".tabbar");
      if (bar && bar.__sync) bar.__sync();
    }, 150);
  });

  var lastReminderMinute = null;

  /* 每秒只更新两个文本节点，成本很低；但页面不可见时没必要跑，
     所以切到后台就停掉计时器，回到前台立刻补一次再继续。 */
  function tick() {
    var now = Date.now();
    if (L.dayKey(now) !== lastDayKey) {
      lastDayKey = L.dayKey(now);
      render();
      return;
    }
    var currentMinute = L.dayKey(now) + " " + new Date(now).getHours() + ":" + new Date(now).getMinutes();
    if (currentMinute !== lastReminderMinute) {
      lastReminderMinute = currentMinute;
      if (checkReminder(now)) render();
    }
    $$('[data-live="streak"]').forEach(function (el) {
      var habit = getHabit(el.getAttribute("data-id"));
      if (habit) el.innerHTML = timerInner(habit, now);
    });
    $$('[data-live="streak-text"]').forEach(function (el) {
      var habit = getHabit(el.getAttribute("data-id"));
      if (habit) el.textContent = habitSubText(habit, now);
    });
  }

  var tickTimer = null;
  function startTick() {
    if (tickTimer === null) tickTimer = setInterval(tick, 1000);
  }
  function stopTick() {
    if (tickTimer !== null) {
      clearInterval(tickTimer);
      tickTimer = null;
    }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      stopTick();
    } else {
      tick();
      startTick();
      scheduleReminderTimer();
    }
  });

  /* 所有按钮共用同一套按压与松手回弹 */
  var pressedButton = null;
  var lastPointerRelease = { button: null, at: 0 };

  function playButtonRelease(button) {
    if (!button || button.disabled) return;
    button.classList.remove("is-spring-release");
    void button.offsetWidth;
    button.classList.add("is-spring-release");
  }

  document.addEventListener("pointerdown", function (event) {
    var button = event.target.closest("button");
    if (!button || button.disabled) return;
    pressedButton = button;
    button.classList.remove("is-spring-release");
  }, { passive: true });

  document.addEventListener("pointerup", function () {
    if (!pressedButton) return;
    var button = pressedButton;
    pressedButton = null;
    lastPointerRelease = { button: button, at: Date.now() };
    playButtonRelease(button);
  }, { passive: true });

  document.addEventListener("pointercancel", function () {
    if (!pressedButton) return;
    var button = pressedButton;
    pressedButton = null;
    lastPointerRelease = { button: button, at: Date.now() };
    playButtonRelease(button);
  }, { passive: true });

  document.addEventListener("click", function (event) {
    var button = event.target.closest("button");
    if (!button || button.disabled) return;
    if (lastPointerRelease.button === button && Date.now() - lastPointerRelease.at < 600) return;
    playButtonRelease(button);
  });

  startTick();

  registerReminderWorker();
  render(true);
  window.setTimeout(function () {
    checkReminder(Date.now());
  }, 250);
})();

</script>
