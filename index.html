<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />

         iOS 出于无障碍会忽略这两个，所以样式里还有一层 touch-action） -->

      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e1116" id="themeColor" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="解瘾 · 不良嗜好戒断助手：戒断计时、冲动急救、省钱与身体恢复里程碑。数据只存在本机。" />
    <title>解瘾 · 不良嗜好戒断助手</title>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="statusBarStyle" />
    <meta name="apple-mobile-web-app-title" content="解瘾" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AA%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="logic.js"></script>
    <script src="glass.js"></script>
    <script src="app.js"></script>
  </body>
</html>
