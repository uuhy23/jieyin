    if (signature !== current) {
      var map = buildMapData(rect.width, rect.height, radius, band, strength);
      feMap.setAttribute("width", String(rect.width));
      feMap.setAttribute("height", String(rect.height));
      feMap.setAttributeNS("http://www.w3.org/1999/xlink", "href", map.url);
      feMap.setAttribute("href", map.url);
      feDisp.setAttribute("scale", String(map.scale));
      feBlur.setAttribute("stdDeviation", String(blur));
      feSat.setAttribute("values", String(saturate));
      current = signature;
    }

    if (supportsBackdropUrl()) {
      // 模糊、饱和度、折射都在这个滤镜里完成（Chromium）
      el.style.webkitBackdropFilter = "url(#" + FILTER_ID + ")";
      el.style.backdropFilter = "url(#" + FILTER_ID + ")";
    }
  }

  function scan() {
    var nodes = document.querySelectorAll(".glass");
    for (var i = 0; i < nodes.length; i++) applyTo(nodes[i]);
  }

  var scanTimer = null;
  function scheduleScan() {
    clearTimeout(scanTimer);
    /* 等 350ms 再扫：切页签时胶囊正在做 380ms 的形变动画，
       如果这时候重算位移贴图（要跑一遍 canvas 逐像素循环）会占住主线程、把动画卡掉。 */
    scanTimer = setTimeout(scan, 350);
  }

  function start() {
    if (!document.body) return;
    scan();
    window.addEventListener("resize", scheduleScan);
    if (window.MutationObserver) {
      // 只盯住 #app 的直接子节点：切页签会把底栏整个重建，这时要重新贴一次样式。
      // 不递归观察子树，避免每秒计时器刷新也触发扫描。
      var app = document.getElementById("app");
      if (app) new MutationObserver(scheduleScan).observe(app, { childList: true });
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();

  // 想手动调用也行（框架里可以只留这一段）
  window.LiquidGlass = { apply: applyTo, refresh: scheduleScan, scan: scan };
})();

</script>
    <script>
/* app.js — 状态与界面层。数据全部保存在浏览器 localStorage，不联网。 */
(function () {
  "use strict";

  var L = window.QuitLogic;
  var STORAGE_KEY = "jieyin.v1";

  /* ==================== 状态 ==================== */

  function uid(prefix) {
    return (prefix || "h") + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function emptyState() {
    return {
      version: 1,
      theme: "system",
      view: "home",
      activeId: null,
      habits: [],
      slogans: [],
      reminder: { enabled: false, time: "20:00", lastNotified: null }
    };
  }

  var ui = {
    sloganOffset: 0,
    monthCursor: null,
    yearCursor: null,
    milestonesOpen: false,
    tabGeom: null,
    tabTimer: null,
    suppressTabClick: 0,
    lastViewKey: null,
    forceAnim: false,
    pageMotion: null,
    pulse: null,
    sloganAnim: false
  };

  function reduceMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  /* 轻微震动，让点按有实感（iPhone 不支持，会自动忽略） */
  function tapFeedback(strong) {
    if (!navigator.vibrate || reduceMotion()) return;
    try {
      navigator.vibrate(strong ? 16 : 7);
    } catch (err) {
      /* 忽略 */
    }
  }

  var systemTheme = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

  /* 主题三选一：黑 / 白 / 跟随系统 */
  function resolvedTheme() {
    if (state.theme === "light" || state.theme === "dark") return state.theme;
    return systemTheme && systemTheme.matches ? "dark" : "light";
  }

  function currentHabit() {
    return getHabit(state.activeId) || state.habits[0] || null;
  }

  function cursorMonth() {
    return ui.monthCursor || L.currentMonth();
  }

  function cursorYear() {
    return ui.yearCursor == null ? new Date().getFullYear() : ui.yearCursor;
  }

  function isNum(v) {
    return typeof v === "number" && isFinite(v);
  }

  function normalizeSlogans(list) {
    var out = [];
    (Array.isArray(list) ? list : []).forEach(function (item) {
      if (typeof item !== "string") return;
      var text = item.trim().slice(0, 60);
      if (text && out.indexOf(text) === -1) out.push(text);
    });
    return out.slice(0, 50);
  }

  function normalizeReminder(raw) {
    raw = raw || {};
    var time = typeof raw.time === "string" && /^\d{2}:\d{2}$/.test(raw.time) ? raw.time : "20:00";
    return {
      enabled: raw.enabled === true,
      time: time,
      lastNotified: typeof raw.lastNotified === "string" ? raw.lastNotified : null
    };
  }

  function normalizeHabit(raw) {
    raw = raw || {};
    var preset = L.getPreset(raw.presetKey) || L.getPreset("other");
    var milestones = Array.isArray(raw.milestones)
      ? raw.milestones.filter(function (m) {
          return m && isNum(m.ms) && m.title;
        })
      : [];
    var habit = {
      id: typeof raw.id === "string" && raw.id ? raw.id : uid(),
      presetKey: typeof raw.presetKey === "string" ? raw.presetKey : preset.key,
      name: typeof raw.name === "string" && raw.name.trim() ? raw.name.trim() : preset.name,
      emoji: typeof raw.emoji === "string" && raw.emoji ? raw.emoji : preset.emoji,
      unit: typeof raw.unit === "string" ? raw.unit : preset.unit,
      dailyCost: isNum(Number(raw.dailyCost)) ? Math.max(0, Number(raw.dailyCost)) : 0,
      dailyAmount: isNum(Number(raw.dailyAmount)) ? Math.max(0, Number(raw.dailyAmount)) : 0,
      reason: typeof raw.reason === "string" ? raw.reason : "",
      createdAt: isNum(raw.createdAt) ? raw.createdAt : Date.now(),
      cleanSince: isNum(raw.cleanSince) ? raw.cleanSince : Date.now(),
      bestStreakMs: isNum(raw.bestStreakMs) ? Math.max(0, raw.bestStreakMs) : 0,
      milestones: milestones.length ? milestones : L.presetMilestones(preset.key),
      urges: Array.isArray(raw.urges)
        ? raw.urges
            .filter(function (u) {
              return u && isNum(u.at);
            })
            .map(function (u) {
              return {
                id: typeof u.id === "string" && u.id ? u.id : uid("u"),
                at: u.at,
                trigger: typeof u.trigger === "string" ? u.trigger : "",
                intensity: isNum(u.intensity) ? Math.min(5, Math.max(1, u.intensity)) : 3,
                note: typeof u.note === "string" ? u.note : "",
                resisted: u.resisted !== false
              };
            })
        : [],
      relapses: Array.isArray(raw.relapses)
        ? raw.relapses
            .filter(function (r) {
              return r && isNum(r.at);
            })
            .map(function (r) {
              return {
                id: typeof r.id === "string" && r.id ? r.id : uid("r"),
                at: r.at,
                note: typeof r.note === "string" ? r.note : "",
                streakMs: isNum(r.streakMs) ? Math.max(0, r.streakMs) : 0
              };
            })
        : [],
      checkins: Array.isArray(raw.checkins)
        ? raw.checkins.filter(function (k) {
            return typeof k === "string";
          })
        : [],
      /* 补打卡的记录：只留"什么时候动了历史"，用来算每月的配额 */
      edits: Array.isArray(raw.edits)
        ? raw.edits
            .filter(function (e) {
              return e && isNum(e.at);
            })
            .map(function (e) {
              return { at: e.at, key: typeof e.key === "string" ? e.key : "" };
            })
        : []
    };
    habit.costType = L.costTypeOf({ costType: raw.costType, dailyCost: habit.dailyCost, dailyAmount: habit.dailyAmount, unit: habit.unit });
    return habit;
  }

  function load() {
    var s = emptyState();
    var raw;
    try {
      raw = window.localStorage.getItem(STORAGE_KEY);
    } catch (err) {
      console.warn("无法读取本地存储", err);
      return s;
    }
    if (!raw) return s;
    try {
      var data = JSON.parse(raw);
      if (!data || typeof data !== "object") return s;
      s.theme = data.theme === "light" || data.theme === "dark" || data.theme === "system" ? data.theme : "system";
      s.view = ["detail", "month", "year", "settings"].indexOf(data.view) >= 0 ? data.view : "home";
      s.activeId = typeof data.activeId === "string" ? data.activeId : null;
      s.habits = Array.isArray(data.habits) ? data.habits.map(normalizeHabit) : [];
      s.slogans = normalizeSlogans(data.slogans);
      s.reminder = normalizeReminder(data.reminder);
      return s;
    } catch (err) {
      console.warn("本地数据损坏，已忽略", err);
      return s;
    }
  }

  var state = load();

  function save() {
    try {
      window.localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          version: 1,
          theme: state.theme,
          view: state.view,
          activeId: state.activeId,
          habits: state.habits,
          slogans: state.slogans,
          reminder: state.reminder
        })
      );
      return true;
    } catch (err) {
      console.error("保存失败", err);
      toast("保存失败：浏览器存储空间可能已满");
      return false;
    }
  }

  function getHabit(id) {
    for (var i = 0; i < state.habits.length; i++) {
      if (state.habits[i].id === id) return state.habits[i];
    }
    return null;
  }

  /* ==================== 工具 ==================== */

  function $(sel, root) {
    return (root || document).querySelector(sel);
  }

  function $$(sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  }

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var toastTimer = null;
  function toast(text) {
    var el = $("#toast");
    if (!el) return;
    el.textContent = text;
    el.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.classList.remove("show");
    }, 2600);
  }

  function toLocalInput(ts) {
    var d = new Date(ts);
    return (
      d.getFullYear() + "-" + L.pad2(d.getMonth() + 1) + "-" + L.pad2(d.getDate()) + "T" + L.pad2(d.getHours()) + ":" + L.pad2(d.getMinutes())
    );
  }

  function dateTimeText(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "/" + L.pad2(d.getMonth() + 1) + "/" + L.pad2(d.getDate()) + " " + L.pad2(d.getHours()) + ":" + L.pad2(d.getMinutes());
  }

  function timerInner(habit, now) {
    var parts = L.clockParts(L.currentStreakMs(habit, now));
    return '<b class="t-days">' + parts.days + '</b><span class="t-unit">天</span><span class="t-clock">' + parts.clock + "</span>";
  }

  /* ==================== 数据操作 ==================== */

  function toggleCheckin(id, ts) {
    var habit = getHabit(id);
    if (!habit) return;
    var now = Date.now();
    var key = L.dayKey(ts == null ? now : ts);
    var todayKey = L.dayKey(now);

    // 打卡后不能取消
    if (habit.checkins.indexOf(key) !== -1) {
      toast("已打卡，不能取消");
      return;
    }

    var backfillLeft = null;
    if (key !== todayKey) {
      var cursor = L.parseDayKey(key);
      if (!isNum(cursor)) return;
      if (cursor > L.startOfDay(now)) {
        toast(key + " 还没到，先过好今天");
        return;
      }
      // 补打卡要走配额：每月 5 次
      var stamp = new Date(now);
      var quota = L.backfillQuota(habit, stamp.getFullYear(), stamp.getMonth());
      if (!quota.allowed) {
        toast("本月补打卡机会已用完（每月 " + quota.limit + " 次）");
        return;
      }
      habit.edits.push({ at: now, key: key });
      backfillLeft = quota.left - 1;
    }

    habit.checkins.push(key);
    ui.pulse = { id: habit.id, key: key };
    tapFeedback(true);
    toast(
      key === todayKey
        ? "打卡完成：今天也守住了 💪"
        : key + " 已补打卡 ✓" + (backfillLeft !== null ? "（本月还剩 " + backfillLeft + " 次）" : "")
    );
    save();
    render();
  }

  function toggleDay(id, key) {
    var ts = L.parseDayKey(key);
    if (!isNum(ts)) return;
    toggleCheckin(id, ts); // 未到日期、取消、配额都在里面处理
  }

  function addUrge(id, data) {
    var habit = getHabit(id);
    if (!habit) return null;
    var rec = {
      id: uid("u"),
      at: Date.now(),
      trigger: String(data.trigger || "").trim(),
      intensity: Math.min(5, Math.max(1, Number(data.intensity) || 3)),
      note: String(data.note || "").trim(),
      resisted: data.resisted !== false
    };
    habit.urges.push(rec);
    save();
    return rec;
  }

  function addRelapse(id, note) {
    var habit = getHabit(id);
    if (!habit) return null;
    var streak = L.currentStreakMs(habit);
    habit.bestStreakMs = Math.max(habit.bestStreakMs, streak);
    var rec = { id: uid("r"), at: Date.now(), note: String(note || "").trim(), streakMs: streak };
    habit.relapses.push(rec);
    habit.cleanSince = Date.now();
    save();
    return rec;
  }

  function createHabit(data) {
    var now = Date.now();
    var habit = normalizeHabit({
      id: uid(),
      presetKey: data.presetKey,
      name: data.name,
      emoji: data.emoji,
      unit: data.unit,
      costType: data.costType,
      dailyCost: data.dailyCost,
      dailyAmount: data.dailyAmount,
      reason: data.reason,
      createdAt: now,
      cleanSince: data.cleanSince || now,
      milestones: L.presetMilestones(data.presetKey)
    });
    state.habits.unshift(habit);
    save();
    return habit;
  }

  function updateHabit(id, data) {
    var habit = getHabit(id);
    if (!habit) return;
    habit.name = data.name;
    habit.emoji = data.emoji;
    habit.unit = data.unit;
    habit.costType = data.costType;
    habit.dailyCost = data.dailyCost;
    habit.dailyAmount = data.dailyAmount;
    habit.reason = data.reason;
    habit.cleanSince = data.cleanSince;
    save();
  }

  function deleteHabit(id) {
    for (var i = 0; i < state.habits.length; i++) {
      if (state.habits[i].id === id) {
        state.habits.splice(i, 1);
        break;
      }
    }
    if (state.activeId === id) {
      state.activeId = null;
      state.view = "home";
    }
    save();
    render(true);
  }

  function goHome() {
    ui.pageMotion = state.view === "home" ? null : state.view === "detail" ? "sheet-back" : "back";
    state.view = "home";
    save();
    render(true);
  }

  function pageMotionFor(nextView, nextId) {
    if (nextView === state.view) {
      if (nextView !== "detail" || nextId === undefined || nextId === state.activeId) return null;
      return "sheet-forward";
    }
    if (nextView === "home") return state.view === "detail" ? "sheet-back" : "back";
    if (nextView === "detail") return "sheet-forward";
    if (state.view === "detail") return "forward";
    var order = { home: 0, month: 1, year: 2, settings: 3 };
    return (order[nextView] || 0) >= (order[state.view] || 0) ? "forward" : "back";
  }

  function goTo(view, id) {
    ui.pageMotion = pageMotionFor(view, id);
    state.view = view;
    if (id !== undefined) state.activeId = id;
    save();
    render(true);
  }

  /* ==================== 弹窗 ==================== */

  function openModal(html, opts) {
    opts = opts || {};
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.setAttribute("role", "dialog");
    overlay.setAttribute("aria-modal", "true");
    overlay.innerHTML = '<div class="modal ' + (opts.size || "") + '">' + html + "</div>";
    document.body.appendChild(overlay);
    document.body.classList.add("modal-open");
    if (opts.backdropClose !== false) {
      overlay.addEventListener("mousedown", function (e) {
        if (e.target === overlay) closeModal(overlay);
      });
    }
    scheduleContinuousCornersFallback();
    return overlay;
  }

  function closeModal(overlay) {
    if (!overlay) return;
    if (overlay.classList.contains("is-closing")) return;
    if (typeof overlay.__cleanup === "function") overlay.__cleanup();
    overlay.classList.add("is-closing");
    if (!$(".overlay:not(.is-closing)")) document.body.classList.remove("modal-open");
    var delay = reduceMotion() ? 0 : 420;
    window.setTimeout(function () {
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      if (!$(".overlay:not(.is-closing)") && !$(".overlay")) document.body.classList.remove("modal-open");
    }, delay);
  }

  function closeTopModal() {
    var all = $$(".overlay");
    if (all.length) closeModal(all[all.length - 1]);
  }

  /* ==================== 自律标语 ==================== */

  function sloganPool() {
    return state.slogans.concat(L.SLOGANS);
  }

  function sloganHTML() {
    return (
      '<section class="card slogan">' +
      '<span class="slogan-label">' + (ui.sloganOffset ? "换了一句" : "今日标语") + "</span>" +
      '<p class="slogan-text' + (ui.sloganAnim ? " slogan-in" : "") + '">' + esc(L.sloganForDay(sloganPool(), L.dayKey(Date.now()), ui.sloganOffset)) + "</p>" +
      '<div class="slogan-actions">' +
      '<button class="link-btn" data-act="next-slogan">换一句</button>' +
      '<button class="link-btn" data-act="manage-slogans">我的标语' +
      (state.slogans.length ? "（" + state.slogans.length + "）" : "") +
      "</button>" +
      "</div></section>"
    );
  }

  function sloganListHTML() {
    if (!state.slogans.length) return '<p class="muted small">还没有自定义标语。写一句对自己最管用的话，它就会出现在首页和呼吸引导里。</p>';
    return (
      '<ul class="logs">' +
      state.slogans
        .map(function (text, index) {
          return (
            '<li><div><b>' +
            esc(text) +
            '</b></div><button class="btn ghost small-btn" data-slogan-del="' +
            index +
            '">删除</button></li>'
          );
        })
        .join("") +
      "</ul>"
    );
  }

  function openSloganManager() {
    var overlay = openModal(
      "<h2>我的标语</h2>" +
        '<p class="muted small">自己写的句子最管用。它们会和内置标语一起轮换出现在首页，也会出现在急救呼吸引导里。</p>' +
        '<div data-slogan-list>' +
        sloganListHTML() +
        "</div>" +
        '<label class="field"><span>添加一句</span><input type="text" data-new-slogan maxlength="60" placeholder="例如：撑过这一分钟就够了"></label>' +
        '<div class="modal-foot">' +
        '<button class="btn ghost" data-slogan="close">关闭</button>' +
        '<button class="btn primary" data-slogan="add">添加</button>' +
        "</div>",
      {}
    );

    function refresh() {
      $("[data-slogan-list]", overlay).innerHTML = sloganListHTML();
    }

    overlay.addEventListener("click", function (e) {
      var del = e.target.closest("[data-slogan-del]");
      if (del) {
        state.slogans.splice(Number(del.getAttribute("data-slogan-del")), 1);
        save();
        refresh();
        render();
        toast("已删除");
        return;
      }
      var btn = e.target.closest("[data-slogan]");
      if (!btn) return;
      if (btn.getAttribute("data-slogan") === "close") {
        closeModal(overlay);
        return;
      }
      var input = $("[data-new-slogan]", overlay);
      var text = input.value.trim().slice(0, 60);
      if (!text) {
        toast("先写一句吧");
        return;
      }
      if (state.slogans.indexOf(text) !== -1) {
        toast("这句已经加过了");
        return;
      }
      if (state.slogans.length >= 50) {
        toast("最多存 50 句");
        return;
      }
      state.slogans.push(text);
      save();
      input.value = "";
      refresh();
      render();
      toast("已加入，会自动和内置标语轮换");
    });
  }

  function presetButtonHTML(preset, attr) {
    return (
      '<button class="list-row" ' +
      attr +
      '><span class="row-tile">' +
      preset.emoji +
      '</span><span class="row-name">' +
      esc(preset.name) +
      '</span><span class="row-chev">›</span></button>'
    );
  }

  function presetModuleHTML(preset, attr) {
    return (
      '<button class="option-module" ' +
      attr +
      '><span class="row-tile">' +
      preset.emoji +
      '</span><span class="row-name">' +
      esc(preset.name) +
      '</span><span class="row-chev">›</span></button>'
    );
  }

  function openPresetPicker() {
    var overlay = openModal(
      "<h2>添加戒断目标</h2>" +
        '<p class="muted small">选一个开始。名称、图标和衡量标准进去之后都能改。</p>' +
        '<div class="option-modules">' +
        L.PRESETS.map(function (preset) {
          return presetModuleHTML(preset, 'data-pick="' + preset.key + '"');
        }).join("") +
        "</div>" +
        '<div class="modal-foot"><button class="btn ghost" data-pick="cancel">取消</button></div>',
      {}
    );
    overlay.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-pick]");
      if (!btn) return;
      var key = btn.getAttribute("data-pick");
      closeModal(overlay);
      if (key !== "cancel") openHabitForm(null, key);
    });
  }

  function habitFormHTML(habit, preset) {
    var name = habit ? habit.name : preset.name;
    var emoji = habit ? habit.emoji : preset.emoji;
    var unit = habit ? habit.unit : preset.unit;
    var reason = habit ? habit.reason : preset.sampleReason;
    var cleanSince = habit ? habit.cleanSince : Date.now();
    var costType = L.costTypeOf(habit || preset);
    var amount = L.costPerDay(habit || preset);
    var segHTML = L.COST_TYPES.map(function (type) {
      return (
        '<button type="button" class="seg-btn' + (type.key === costType ? " active" : "") + '" data-type="' + type.key + '">' + type.label + "</button>"
      );
    }).join("");

    return (
      "<h2>" +
      (habit ? "编辑目标" : "新的戒断目标") +
      "</h2>" +
      '<p class="muted small">这些信息只用来算数：计时、算你省回了什么，以及提醒你自己为什么开始。</p>' +
      '<div class="form">' +
      '<label class="field"><span>名称</span><input type="text" name="name" maxlength="24" value="' + esc(name) + '" placeholder="例如：吸烟 / 熬夜 / 刷短视频" required></label>' +
      '<div class="field"><span>用什么标准衡量它占用的代价</span><div class="seg" data-cost-type>' + segHTML + "</div>" +
      '<em class="hint" data-cost-hint></em></div>' +
      '<div class="row"><label class="field"><span data-amount-label>每天的量</span><input type="number" name="amount" min="0" step="0.5" value="' + esc(amount) + '"></label>' +
      '<label class="field" data-unit-field><span>计量单位</span><input type="text" name="unit" maxlength="6" value="' + esc(unit) + '" placeholder="支 / 次 / 杯"></label></div>' +
      '<div class="row">' +
      '<label class="field"><span>图标</span><input type="text" name="emoji" maxlength="4" value="' + esc(emoji) + '"></label>' +
      '<label class="field"><span>开始时间</span><input type="datetime-local" name="cleanSince" value="' + toLocalInput(cleanSince) + '"><em class="hint">已经戒了一段时间就改成真正开始的那天</em></label>' +
      "</div>" +
      '<label class="field"><span>为什么想戒掉它</span><textarea name="reason" rows="3" maxlength="200" placeholder="想抽的时候会看到这句话">' + esc(reason) + "</textarea></label>" +
      "</div>" +
      '<div class="modal-foot">' +
      '<button class="btn ghost" data-form="cancel">取消</button>' +
      '<button class="btn primary" data-form="submit">' + (habit ? "保存" : "开始戒断") + "</button>" +
      "</div>"
    );
  }

  function openHabitForm(habitId, presetKey) {
    var habit = habitId ? getHabit(habitId) : null;
    var preset = habit ? L.getPreset(habit.presetKey) || L.getPreset("other") : L.getPreset(presetKey) || L.getPreset("other");
    var overlay = openModal(habitFormHTML(habit, preset), {});
    var form = $(".form", overlay);

    function applyCostType(type) {
      var meta = L.getCostType(type);
      $$("[data-cost-type] .seg-btn", overlay).forEach(function (btn) {
        btn.classList.toggle("active", btn.getAttribute("data-type") === type);
      });
      $("[data-cost-hint]", overlay).textContent = meta.hint;
      $("[data-amount-label]", overlay).textContent = meta.fieldLabel;
      $("[data-unit-field]", overlay).style.display = type === "custom" ? "" : "none";
      $('[name="amount"]', form).placeholder = type === "money" ? "例如 20" : type === "time" ? "例如 2" : "例如 3";
    }

    function collect() {
      function val(sel) {
        return $('[name="' + sel + '"]', form).value.trim();
      }
      var name = val("name");
      if (!name) {
        toast("给这个目标起个名字吧");
        return null;
      }
      var activeSeg = $("[data-cost-type] .seg-btn.active", overlay);
      var costType = activeSeg ? activeSeg.getAttribute("data-type") : "money";
      var amount = Math.max(0, Number(val("amount")) || 0);
      var timeValue = val("cleanSince");
      var parsed = timeValue ? new Date(timeValue).getTime() : NaN;
      return {
        presetKey: habit ? habit.presetKey : preset.key,
        name: name,
        emoji: val("emoji") || preset.emoji,
        costType: costType,
        unit: costType === "time" ? "小时" : val("unit") || "次",
        dailyCost: costType === "money" ? amount : 0,
        dailyAmount: costType === "money" ? 0 : amount,
        reason: val("reason"),
        cleanSince: isNum(parsed) && parsed <= Date.now() + 60000 ? parsed : Date.now()
      };
    }

    overlay.addEventListener("click", function (e) {
      var seg = e.target.closest("[data-cost-type] .seg-btn");
      if (seg) {
        applyCostType(seg.getAttribute("data-type"));
        return;
      }
      var btn = e.target.closest("[data-form]");
      if (!btn) return;
      var action = btn.getAttribute("data-form");
      if (action === "cancel") {
        closeModal(overlay);
        return;
      }
      if (action === "submit") {
        var data = collect();
        if (!data) return;
        if (habit) {
          updateHabit(habit.id, data);
          closeModal(overlay);
          toast("已保存");
          render();
        } else {
          var created = createHabit(data);
          closeModal(overlay);
          toast("开始计时，随时可以来记一笔 👊");
          goTo("detail", created.id);
        }
      }
    });

    applyCostType(costTypeOfForm());

    function costTypeOfForm() {
      var active = $("[data-cost-type] .seg-btn.active", overlay);
      return active ? active.getAttribute("data-type") : "money";
    }
  }

  /* ==================== 冲动急救 ==================== */

  function logFormHTML(habit) {
    var chips = L.TRIGGERS.map(function (t) {
      return '<button type="button" class="chip" data-trigger="' + esc(t) + '">' + esc(t) + "</button>";
    }).join("");
    return (
      '<div class="sos-step">' +
      "<h3>这一波是怎么来的？</h3>" +
      '<p class="muted small">记清楚触发点，比靠意志力硬扛有用得多。</p>' +
      '<div class="chips" data-chips>' +
      chips +
      "</div>" +
      '<label class="field"><span>或者自己写一个</span><input type="text" data-custom maxlength="20" placeholder="例如：加班到很晚"></label>' +
      '<label class="field"><span>冲动的强度：<b data-intensity-label>3</b> / 5</span><input type="range" min="1" max="5" step="1" value="3" data-intensity></label>' +
      '<label class="field"><span>想对自己说点什么（可以不写）</span><textarea data-note rows="2" maxlength="120" placeholder="写下来，冲动会弱一点"></textarea></label>' +
      '<div class="modal-foot">' +
      '<button class="btn ghost" data-log="gavein">我没挺住</button>' +
      '<button class="btn primary" data-log="resist">我挺过去了</button>' +
      "</div>" +
      "</div>"
    );
  }

  function readLogForm(root) {
    var selected = $(".chip.selected", root);
    var custom = $("[data-custom]", root);
    var trigger = (custom && custom.value.trim()) || (selected ? selected.getAttribute("data-trigger") : "") || "说不清";
    var intensityEl = $("[data-intensity]", root);
    var noteEl = $("[data-note]", root);
    return {
      trigger: trigger,
      intensity: intensityEl ? Number(intensityEl.value) : 3,
      note: noteEl ? noteEl.value : ""
    };
  }

  function wireLogForm(root, habit) {
    $$(".chip", root).forEach(function (chip) {
      chip.addEventListener("click", function () {
        var isSelected = chip.classList.contains("selected");
        $$(".chip", root).forEach(function (c) {
          c.classList.remove("selected");
        });
        if (!isSelected) chip.classList.add("selected");
      });
    });
    var range = $("[data-intensity]", root);
    var label = $("[data-intensity-label]", root);
    if (range && label) {
      range.addEventListener("input", function () {
        label.textContent = range.value;
      });
    }
  }

  function resistResultHTML(habit, entry, streakBefore) {
    var stats = L.urgeStats(habit);
    return (
      '<div class="result">' +
      '<div class="result-icon">💪</div>' +
      "<h3>你赢了这一轮</h3>" +
      '<p class="muted">' +
      esc(L.pick(L.ENCOURAGEMENTS)) +
      "</p>" +
      '<ul class="facts">' +
      "<li>触发因素：<b>" + esc(entry.trigger) + "</b>（强度 " + entry.intensity + "/5）</li>" +
      "<li>你已经坚持了 <b>" + L.formatDuration(streakBefore) + "</b></li>" +
      "<li>到目前为止，你一共扛住了 <b>" + stats.resisted + "</b> 次冲动</li>" +
      "</ul>" +
      '<div class="modal-foot"><button class="btn primary" data-log="close">继续</button></div>' +
      "</div>"
    );
  }

  function gaveInResultHTML(habit, entry, relapse) {
    return (
      '<div class="result">' +
      '<div class="result-icon">🩹</div>' +
      "<h3>没关系，先记下来</h3>" +
      '<p class="muted">' + esc(L.pick(L.RELAPSE_MESSAGES)) + "</p>" +
      '<ul class="facts">' +
      "<li>这一次之前，你坚持了 <b>" + L.formatDuration(relapse.streakMs) + "</b>" +
      (relapse.streakMs >= habit.bestStreakMs ? "（新纪录，已经写进最长记录）" : "") +
      "</li>" +
      "<li>触发因素：<b>" + esc(entry.trigger) + "</b>（强度 " + entry.intensity + "/5）</li>" +
      "<li>下次遇到「" + esc(entry.trigger) + "」，先做一次一分钟呼吸，再来决定。</li>" +
      "</ul>" +
      '<div class="modal-foot"><button class="btn primary" data-log="close">重新开始计时</button></div>' +
      "</div>"
    );
  }

  function openSOS(habitId) {
    var habit = getHabit(habitId);
    if (!habit) return;
    var tip = L.pick(L.CRAVING_TIPS);
    var overlay = openModal(
      "<h2>现在很想" + esc(habit.name) + "？</h2>" +
        '<p class="muted small">冲动像海浪，会涨也会退。我们只需要先撑过这一分钟，然后再决定。</p>' +
        '<div class="tip">' + esc(tip) + "</div>" +
        '<ul class="facts">' +
        "<li>先做一分钟呼吸，让身体从紧绷里退出来</li>" +
        "<li>记下是什么引爆了它</li>" +
        "<li>最后再决定要不要真的破戒</li>" +
        "</ul>" +
        '<div class="modal-foot">' +
        '<button class="btn ghost" data-sos="skip">跳过呼吸，直接记录</button>' +
        '<button class="btn primary" data-sos="start">开始一分钟呼吸</button>' +
        "</div>",
      { backdropClose: false }
    );

    var timers = [];
    overlay.__cleanup = function () {
      timers.forEach(clearTimeout);
      timers = [];
    };

    function logStep() {
      var wrap = document.createElement("div");
      wrap.innerHTML = logFormHTML(habit);
      overlay.innerHTML = '<div class="modal-body">' + wrap.innerHTML + "</div>";
      wireLogForm(overlay, habit);
    }

    function breathStep() {
      overlay.innerHTML =
        '<div class="modal-body">' +
        '<h3 class="center">跟着圆圈呼吸</h3>' +
        '<div class="breath-wrap"><div class="breath-circle" data-circle><span data-phase>准备</span></div></div>' +
        '<p class="center muted small" data-round>第 1 / 3 轮 · 吸气 4 秒，屏住 7 秒，呼气 8 秒</p>' +
        '<p class="center small slogan-inline">' + esc(L.pick(sloganPool())) + "</p>" +
        '<div class="modal-foot"><button class="btn ghost" data-sos="skip">跳过</button></div>' +
        "</div>";

      var circle = $("[data-circle]", overlay);
      var phaseEl = $("[data-phase]", overlay);
      var roundEl = $("[data-round]", overlay);
      var phases = [
        { label: "吸气", secs: 4, scale: 1.35 },
        { label: "屏住", secs: 7, scale: 1.35 },
        { label: "呼气", secs: 8, scale: 1 }
      ];
      var round = 0;
      var index = 0;

      function run() {
        if (round >= 3) {
          phaseEl.textContent = "很好";
          logStep();
          return;
        }
        var phase = phases[index];
        phaseEl.textContent = phase.label + " " + phase.secs;
        circle.style.transitionDuration = phase.secs + "s";
        circle.style.transform = "scale(" + phase.scale + ")";
        timers.push(
          setTimeout(function () {
            index++;
            if (index >= phases.length) {
              index = 0;
              round++;
              if (roundEl) roundEl.textContent = "第 " + Math.min(round + 1, 3) + " / 3 轮 · 你已经撑过 " + round * 19 + " 秒";
            }
            run();
          }, phase.secs * 1000)
        );
      }

      circle.style.transitionDuration = "0s";
      circle.style.transform = "scale(1)";
      timers.push(
        setTimeout(function () {
          run();
        }, 60)
      );
    }

    overlay.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-sos],[data-log]");
      if (!btn) return;
      var sos = btn.getAttribute("data-sos");
      if (sos === "start") {
        breathStep();
        return;
      }
      if (sos === "skip") {
        logStep();
        return;
      }
      var action = btn.getAttribute("data-log");
      if (action === "close") {
        closeModal(overlay);
        return;
      }
      var entry = readLogForm(overlay);
      var wrap = $(".modal-body", overlay) || overlay;
      if (action === "resist") {
        var streakBefore = L.currentStreakMs(habit);
        addUrge(habit.id, { trigger: entry.trigger, intensity: entry.intensity, note: entry.note, resisted: true });
        if (!L.isCheckedIn(habit, Date.now())) {
          habit.checkins.push(L.dayKey(Date.now()));
          save();
        }
        wrap.innerHTML = resistResultHTML(habit, entry, streakBefore);
        toast("扛过去一次，今天也帮你打卡了");
      } else {
        addUrge(habit.id, { trigger: entry.trigger, intensity: entry.intensity, note: entry.note, resisted: false });
        var relapse = addRelapse(habit.id, entry.note);
        wrap.innerHTML = gaveInResultHTML(habit, entry, relapse);
      }
      render();
    });
  }

  function openRelapse(habitId) {
    var habit = getHabit(habitId);
    if (!habit) return;
    var overlay = openModal(
      "<h2>记录一次复吸</h2>" +
        '<p class="muted small">计时会重新开始，但你已经坚持的记录会保留在「最长记录」里。</p>' +
        '<label class="field"><span>当时发生了什么？（写下它，下次就有准备）</span><textarea data-note rows="3" maxlength="160" placeholder="例如：和客户应酬，喝了两杯之后没忍住"></textarea></label>' +
        '<div class="modal-foot"><button class="btn ghost" data-re="cancel">取消</button><button class="btn danger" data-re="ok">确认，重新开始</button></div>',
      {}
    );
    overlay.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-re]");
      if (!btn) return;
      if (btn.getAttribute("data-re") === "cancel") {
        closeModal(overlay);
        return;
      }
      var noteEl = $("[data-note]", overlay);
      addRelapse(habit.id, noteEl ? noteEl.value : "");
      closeModal(overlay);
      toast("记录好了，重新开始计时");
      render();
    });
  }

  /* ==================== 记录与复盘 ==================== */

  function allHabitRecords(habit) {
    if (!habit) return [];
    var rows = [];
    habit.urges.forEach(function (u) {
      rows.push({
        type: "urge",
        id: u.id,
        at: u.at,
        trigger: u.trigger,
        intensity: u.intensity,
        note: u.note,
        resisted: u.resisted !== false
      });
    });
    habit.relapses.forEach(function (r) {
      rows.push({
        type: "relapse",
        id: r.id,
        at: r.at,
        note: r.note,
        streakMs: r.streakMs
      });
    });
    rows.sort(function (a, b) {
      return b.at - a.at;
    });
    return rows;
  }

  function recordTitle(row) {
    if (row.type === "relapse") return "重新开始计时";
    return row.resisted ? "扛住冲动" : "没挺住";
  }

  function recordDetailText(row) {
    if (row.type === "urge") {
      return "触发：" + (row.trigger || "说不清") + " · 强度 " + row.intensity + "/5";
    }
    return "此前坚持 " + L.formatDuration(row.streakMs) + (row.note ? " · " + row.note : "");
  }

  function recordItemHTML(row, allowActions) {
    return (
      '<li class="record-item">' +
      '<div class="record-head"><b>' + esc(recordTitle(row)) + "</b><time>" + esc(dateTimeText(row.at)) + "</time></div>" +
      '<div class="record-detail">' + esc(recordDetailText(row)) + "</div>" +
      (row.type === "urge" && row.note ? '<div class="record-note">' + esc(row.note) + "</div>" : "") +
      (allowActions
        ? '<div class="record-actions">' +
          '<button class="link-btn" data-record-edit data-record-type="' + row.type + '" data-record-id="' + esc(row.id) + '">改备注</button>' +
          '<button class="link-btn" data-record-del data-record-type="' + row.type + '" data-record-id="' + esc(row.id) + '">删除误记</button>' +
          "</div>"
        : "") +
      "</li>"
    );
  }

  function recordSummaryHTML(habit) {
    var stats = L.urgeStats(habit);
    var top = L.triggerTally(habit)[0];
    return (
      '<div class="record-summary">' +
      '<div class="record-stat"><span>冲动</span><b>' + stats.total + " 次</b></div>" +
      '<div class="record-stat"><span>扛住率</span><b>' + (stats.total ? Math.round(stats.rate * 100) : 0) + "%</b></div>" +
      '<div class="record-stat"><span>最常见触发</span><b title="' +
      esc(top ? top.trigger : "") +
      '">' +
      esc(top ? top.trigger : "暂无") +
      "</b></div>" +
      "</div>"
    );
  }

  function recordsPreviewHTML(habit) {
    var rows = allHabitRecords(habit);
    if (!rows.length) {
      return (
        '<section class="card"><h3>记录与复盘</h3>' +
        '<p class="muted small">还没有冲动或破戒记录。想抽的时候点「我有点想…」，记录下来的触发点会集中显示在这里。</p>' +
        "</section>"
      );
    }
    return (
      '<section class="card"><h3>记录与复盘</h3>' +
      recordSummaryHTML(habit) +
      '<ul class="record-list">' +
      rows.slice(0, 3).map(function (row) { return recordItemHTML(row, false); }).join("") +
      "</ul>" +
      '<div class="actions"><button class="btn ghost small-btn" data-act="open-records" data-id="' + habit.id + '">查看全部记录</button></div>' +
      "</section>"
    );
  }

  function openRecordEditor(habit, type, id, onSaved) {
    var list = type === "relapse" ? habit.relapses : habit.urges;
    var rec = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) {
        rec = list[i];
        break;
      }
    }
    if (!rec) return;
    var overlay = openModal(
      "<h2>修改记录</h2>" +
        (type === "urge"
          ? '<label class="field"><span>触发因素</span><input data-record-trigger maxlength="20" value="' + esc(rec.trigger) + '"></label>' +
            '<label class="field"><span>冲动强度：<b data-record-intensity-label>' + rec.intensity + '</b> / 5</span><input type="range" min="1" max="5" step="1" value="' + rec.intensity + '" data-record-intensity></label>'
          : "") +
        '<label class="field"><span>备注</span><textarea data-record-note rows="3" maxlength="160">' + esc(rec.note) + "</textarea></label>" +
        '<div class="modal-foot"><button class="btn ghost" data-record-save="cancel">取消</button>' +
        '<button class="btn primary" data-record-save="save">保存</button></div>',
      {}
    );
    var range = $("[data-record-intensity]", overlay);
    var label = $("[data-record-intensity-label]", overlay);
    if (range && label) {
      range.addEventListener("input", function () {
        label.textContent = range.value;
      });
    }
    overlay.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-record-save]");
      if (!btn) return;
      if (btn.getAttribute("data-record-save") === "cancel") {
        closeModal(overlay);
        return;
      }
      rec.note = ($("[data-record-note]", overlay).value || "").trim().slice(0, 160);
      if (type === "urge") {
        rec.trigger = ($("[data-record-trigger]", overlay).value || "").trim().slice(0, 20) || "说不清";
        rec.intensity = Math.min(5, Math.max(1, Number($("[data-record-intensity]", overlay).value) || 3));
      }
      save();
      closeModal(overlay);
      render();
      if (onSaved) onSaved();
      toast("记录已更新");
    });
  }

  function openRecords(habitId) {
    var habit = getHabit(habitId);
    if (!habit) return;
    var filter = "all";
    var overlay = openModal(
      "<h2>" + esc(habit.name) + " · 记录与复盘</h2>" +
        '<p class="muted small">这里保存每次冲动、扛住和破戒的结果。误记可以删除，备注也可以补写。</p>' +
        '<div data-record-summary>' + recordSummaryHTML(habit) + "</div>" +
        '<div class="chips record-filter" data-record-filters>' +
        '<button class="chip selected" data-record-filter="all">全部</button>' +
        '<button class="chip" data-record-filter="urge">冲动</button>' +
        '<button class="chip" data-record-filter="relapse">破戒</button></div>' +
        '<div data-record-list></div>' +
        '<div class="modal-foot"><button class="btn primary" data-record-close>关闭</button></div>',
      { size: "wide" }
    );

    function filteredRows() {
      var rows = allHabitRecords(habit);
      if (filter === "urge") return rows.filter(function (row) { return row.type === "urge"; });
      if (filter === "relapse") return rows.filter(function (row) { return row.type === "relapse"; });
      return rows;
    }

    function refresh() {
      $("[data-record-summary]", overlay).innerHTML = recordSummaryHTML(habit);
      var rows = filteredRows();
      $("[data-record-list]", overlay).innerHTML = rows.length
        ? '<ul class="record-list">' + rows.map(function (row) { return recordItemHTML(row, true); }).join("") + "</ul>"
        : '<div class="record-empty">这一类还没有记录。</div>';
      $$("[data-record-filter]", overlay).forEach(function (btn) {
        btn.classList.toggle("selected", btn.getAttribute("data-record-filter") === filter);
      });
    }

    overlay.addEventListener("click", function (e) {
      var filterBtn = e.target.closest("[data-record-filter]");
      if (filterBtn) {
        filter = filterBtn.getAttribute("data-record-filter");
        refresh();
        return;
      }
      if (e.target.closest("[data-record-close]")) {
        closeModal(overlay);
        return;
      }
      var edit = e.target.closest("[data-record-edit]");
      if (edit) {
        openRecordEditor(habit, edit.getAttribute("data-record-type"), edit.getAttribute("data-record-id"), refresh);
        return;
      }
      var del = e.target.closest("[data-record-del]");
      if (!del) return;
      var type = del.getAttribute("data-record-type");
      var id = del.getAttribute("data-record-id");
      if (!window.confirm("删除这条误记？删除后无法恢复。")) return;
      if (type === "relapse") {
        var removeIndex = -1;
        var latestAt = -1;
        habit.relapses.forEach(function (r, index) {
          if (r.at > latestAt) latestAt = r.at;
          if (r.id === id) removeIndex = index;
        });
        if (removeIndex >= 0) {
          var removed = habit.relapses[removeIndex];
          habit.relapses.splice(removeIndex, 1);
          if (removed.at === latestAt) {
            habit.cleanSince = Math.max(0, removed.at - (removed.streakMs || 0));
          }
        }
      } else {
        habit.urges = habit.urges.filter(function (u) { return u.id !== id; });
      }
      save();
      render();
      refresh();
      toast("误记已删除");
    });

    refresh();
  }

  /* ==================== 每日提醒 ==================== */

  function reminderPermission() {
    if (!("Notification" in window)) return "unsupported";
    return window.Notification.permission || "default";
  }

  function reminderTimeParts() {
    var parts = String(state.reminder.time || "20:00").split(":");
    return {
      hour: Math.min(23, Math.max(0, Number(parts[0]) || 0)),
      minute: Math.min(59, Math.max(0, Number(parts[1]) || 0))
    };
  }

  function timePickerHTML() {
    var parts = reminderTimeParts();
    var hours = "";
    var minutes = "";
    var i;
    for (i = 0; i < 24; i++) {
      hours +=
        '<button type="button" class="time-option' + (i === parts.hour ? " selected" : "") +
        '" data-time-hour="' + i + '" aria-label="' + i + ' 点">' + L.pad2(i) + "</button>";
    }
    for (i = 0; i < 60; i++) {
      minutes +=
        '<button type="button" class="time-option' + (i === parts.minute ? " selected" : "") +
        '" data-time-minute="' + i + '" aria-label="' + i + ' 分">' + L.pad2(i) + "</button>";
    }
    return (
      "<h2>设置提醒时间</h2>" +
      '<p class="muted small">上下滑动选择时间。只有点「✓ 确认」后才会保存，滑到一半或直接关闭都不会修改。</p>' +
      '<div class="time-picker">' +
      '<div class="time-wheel" data-hour-wheel>' + hours + "</div>" +
      '<span class="time-picker-colon">:</span>' +
      '<div class="time-wheel" data-minute-wheel>' + minutes + "</div>" +
      "</div>" +
      '<p class="time-picker-preview">每天 <b data-time-preview>' +
      L.pad2(parts.hour) + ":" + L.pad2(parts.minute) +
      "</b> 提醒</p>" +
      '<div class="modal-foot">' +
      '<button class="btn ghost" data-time-action="cancel">取消</button>' +
      '<button class="btn primary" data-time-action="confirm">✓ 确认</button>' +
      "</div>"
    );
  }

  function openReminderTimePicker() {
    var parts = reminderTimeParts();
    var overlay = openModal(timePickerHTML(), {});
    var hourWheel = $("[data-hour-wheel]", overlay);
    var minuteWheel = $("[data-minute-wheel]", overlay);
    var preview = $("[data-time-preview]", overlay);
    var hour = parts.hour;
    var minute = parts.minute;

    function selectedIndex(wheel) {
      return Math.max(0, Math.min(wheel.children.length - 1, Math.round(wheel.scrollTop / 40)));
    }

    function syncPreview() {
      preview.textContent = L.pad2(hour) + ":" + L.pad2(minute);
    }

    function bindWheel(wheel, type, initial) {
      var frame = null;
      function updateSelection() {
        frame = null;
        var index = selectedIndex(wheel);
        Array.prototype.forEach.call(wheel.children, function (option, optionIndex) {
          option.classList.toggle("selected", optionIndex === index);
        });
        if (type === "hour") hour = index;
        else minute = index;
        syncPreview();
      }
      wheel.addEventListener(
        "scroll",
        function () {
          if (frame !== null) return;
          frame = window.requestAnimationFrame(updateSelection);
        },
        { passive: true }
      );
      wheel.addEventListener("click", function (event) {
        var option = event.target.closest(".time-option");
        if (!option) return;
        var index = Number(type === "hour" ? option.getAttribute("data-time-hour") : option.getAttribute("data-time-minute"));
        wheel.scrollTo({ top: index * 40, behavior: reduceMotion() ? "auto" : "smooth" });
      });
      window.requestAnimationFrame(function () {
        wheel.scrollTop = initial * 40;
        updateSelection();
      });
    }

    bindWheel(hourWheel, "hour", parts.hour);
    bindWheel(minuteWheel, "minute", parts.minute);

    overlay.addEventListener("click", function (event) {
      var btn = event.target.closest("[data-time-action]");
      if (!btn) return;
      var action = btn.getAttribute("data-time-action");
      if (action === "cancel") {
        closeModal(overlay);
        return;
      }
      hour = selectedIndex(hourWheel);
      minute = selectedIndex(minuteWheel);
      var time = L.pad2(hour) + ":" + L.pad2(minute);
      state.reminder.time = time;
      state.reminder.lastNotified = null;
      save();
      closeModal(overlay);
      render();
      toast("提醒时间已保存为 " + time);
    });
  }

  function pendingHabits(now) {
    return state.habits.filter(function (habit) {
      return !L.isCheckedIn(habit, now);
    });
  }

  function missedDaysBeforeToday(habit, now) {
    var cursor = L.addDays(L.startOfDay(now), -1);
    var started = L.startOfDay(habit.createdAt || habit.cleanSince || now);
    var count = 0;
    while (cursor >= started && count < 30) {
      if (L.isCheckedIn(habit, cursor)) break;
      count++;
      cursor = L.addDays(cursor, -1);
    }
    return count;
  }

  function reminderMessage(now) {
    var pending = pendingHabits(now);
    if (!pending.length) return "";
    var missed = 0;
    var missedHabit = null;
    pending.forEach(function (habit) {
      var days = missedDaysBeforeToday(habit, now);
      if (days > missed) {
        missed = days;
        missedHabit = habit;
      }
    });
    if (missed >= 2 && missedHabit) {
      return "「" + missedHabit.name + "」已经连续 " + missed + " 天没有打卡，今天回来记一笔吧。";
    }
    return "今天还有 " + pending.length + " 个目标没有打卡。";
  }

  function reminderBannerHTML(now) {
    if (!state.reminder.enabled || !state.habits.length) return "";
    var target = reminderTimeParts();
    var current = new Date(now);
    if (current.getHours() * 60 + current.getMinutes() < target.hour * 60 + target.minute) return "";
    var message = reminderMessage(now);
    if (!message) return "";
    return (
      '<section class="reminder-banner"><b>今天还没打卡</b><span>' + esc(message) + "</span></section>"
    );
  }

  var reminderWorkerPromise = null;
  var reminderTimer = null;

  function registerReminderWorker() {
    if (reminderWorkerPromise) return reminderWorkerPromise;
    if (!("serviceWorker" in navigator) || !/^https?:$/.test(window.location.protocol)) {
      reminderWorkerPromise = Promise.resolve(null);
      return reminderWorkerPromise;
    }
    reminderWorkerPromise = navigator.serviceWorker
      .register("./sw.js", { scope: "./" })
      .then(function () {
        return navigator.serviceWorker.ready;
      })
      .catch(function () {
        return null;
      });
    return reminderWorkerPromise;
  }

  function showBrowserNotification(title, body) {
    if (!window.Notification) return false;
    try {
      var note = new window.Notification(title, {
        body: body,
        tag: "jieyin-daily-reminder",
        renotify: false
      });
      note.onclick = function () {
        window.focus();
        note.close();
      };
      return true;
    } catch (err) {
      return false;
    }
  }

  function showSystemNotification(title, body) {
    if (reminderPermission() !== "granted") return Promise.resolve(false);
    var options = {
      body: body,
      tag: "jieyin-daily-reminder",
      renotify: false,
      icon: new URL("icon-192.png", window.location.href).href,
      badge: new URL("icon-monochrome-192.png", window.location.href).href,
      data: { url: window.location.href.split("#")[0] }
    };
    return registerReminderWorker().then(function (registration) {
      if (registration && typeof registration.showNotification === "function") {
        return registration.showNotification(title, options).then(
          function () {
            return true;
          },
          function () {
            return showBrowserNotification(title, body);
          }
        );
      }
      return showBrowserNotification(title, body);
    });
  }

  function requestReminderPermission() {
    if (reminderPermission() !== "default" || !window.Notification || !window.Notification.requestPermission) {
      return Promise.resolve(reminderPermission());
    }
    return new Promise(function (resolve) {
      var settled = false;
      function finish(permission) {
        if (settled) return;
        settled = true;
        resolve(permission || reminderPermission());
      }
      try {
        var result = window.Notification.requestPermission(finish);
        if (result && typeof result.then === "function") result.then(finish, function () { finish("denied"); });
      } catch (err) {
        finish("denied");
      }
    });
  }

  function checkReminder(now) {
    if (!state.reminder.enabled || !state.habits.length) return false;
    var target = reminderTimeParts();
    var current = new Date(now);
    if (current.getHours() * 60 + current.getMinutes() < target.hour * 60 + target.minute) return false;
    var today = L.dayKey(now);
    if (state.reminder.lastNotified === today) return false;
    var message = reminderMessage(now);
    if (!message) return false;
    state.reminder.lastNotified = today;
    save();
    if (reminderPermission() === "granted") {
      showSystemNotification("解瘾 · 今日打卡提醒", message).then(function (sent) {
        if (!sent) toast(message);
      });
    } else {
      toast(message);
    }
    return true;
  }

  function toggleReminder() {
    state.reminder.enabled = !state.reminder.enabled;
    save();
    render();
    if (state.reminder.enabled && reminderPermission() === "default" && window.Notification && window.Notification.requestPermission) {
      requestReminderPermission().then(function (permission) {
        toast(permission === "granted" ? "浏览器提醒已开启" : "未获得通知权限，将使用应用内提醒");
        render();
      });
    } else {
      toast(state.reminder.enabled ? "每日提醒已开启" : "每日提醒已关闭");
    }
  }

  function testReminderNow() {
    var message = reminderMessage(Date.now()) || "每日提醒测试：到了该打卡的时间。";
    if (reminderPermission() === "default" && window.Notification && window.Notification.requestPermission) {
      requestReminderPermission().then(function (permission) {
        if (permission === "granted") {
          showSystemNotification("解瘾 · 每日提醒测试", message).then(function (sent) {
            if (!sent) toast(message);
          });
        }
        else toast("未获得通知权限，应用内提醒仍可正常显示");
        render();
      });
      return;
    }
    showSystemNotification("解瘾 · 每日提醒测试", message).then(function (sent) {
      if (!sent) toast(message);
    });
  }

  function clearReminderTimer() {
    if (reminderTimer !== null) {
      clearTimeout(reminderTimer);
      reminderTimer = null;
    }
  }

  function scheduleReminderTimer() {
    clearReminderTimer();
    if (!state.reminder.enabled) return;
    var now = new Date();
    var target = reminderTimeParts();
    var due = new Date(now);
    due.setHours(target.hour, target.minute, 0, 0);
    if (due.getTime() <= now.getTime()) due.setDate(due.getDate() + 1);
    var delay = Math.min(due.getTime() - now.getTime(), 2147483647);
    reminderTimer = window.setTimeout(function () {
      checkReminder(Date.now());
      scheduleReminderTimer();
    }, Math.max(250, delay));
  }

  function downloadCalendarReminder() {
    var target = reminderTimeParts();
    var start = new Date();
    start.setHours(target.hour, target.minute, 0, 0);
    var end = new Date(start.getTime() + 10 * L.MINUTE);
    function localStamp(date) {
      return (
        date.getFullYear() +
        L.pad2(date.getMonth() + 1) +
        L.pad2(date.getDate()) +
        "T" +
        L.pad2(date.getHours()) +
        L.pad2(date.getMinutes()) +
        "00"
      );
    }
    var stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}Z$/, "Z");
    var lines = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//Jieyin//Daily Reminder//ZH-CN",
      "CALSCALE:GREGORIAN",
      "X-WR-CALNAME:解瘾每日提醒",
      "BEGIN:VEVENT",
      "UID:jieyin-daily-" + Date.now() + "@local",
      "DTSTAMP:" + stamp,
      "DTSTART:" + localStamp(start),
      "DTEND:" + localStamp(end),
      "RRULE:FREQ=DAILY",
      "SUMMARY:今天打卡：解瘾",
      "DESCRIPTION:打开解瘾，记录今天的坚持。所有数据仍只保存在你自己的设备中。",
      "BEGIN:VALARM",
      "TRIGGER:PT0M",
      "ACTION:DISPLAY",
      "DESCRIPTION:该打卡了：解瘾",
      "END:VALARM",
      "END:VEVENT",
      "END:VCALENDAR"
    ];
    var blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = "jieyin-daily-reminder.ics";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast("日历提醒文件已生成");
  }

  /* 液态玻璃：高亮胶囊会从左滑到右，拖动底栏松手也能切 */
  function setupTabbar() {
    var bar = $(".tabbar");
    if (!bar) return;
    var indicator = $(".tab-indicator", bar);
    var buttons = $$(".tab-btn", bar);
    if (!indicator || buttons.length < 2) return;

    var activeIndex = 0;
    var i;
    for (i = 0; i < buttons.length; i++) {
      if (buttons[i].classList.contains("active")) activeIndex = i;
    }

    function limit(value, min, max) {
      return value < min ? min : value > max ? max : value;
    }

    /* 胶囊的坐标原点在栏的 padding box 左上角，按钮的位置要用实测值，
       否则会差出一个内边距，第一个格溢出、最后一格短一块 */
    function originX() {
      return bar.getBoundingClientRect().left + bar.clientLeft;
    }

    function spanOf(index) {
      var rect = buttons[index].getBoundingClientRect();
      return { offset: rect.left - originX(), width: rect.width };
    }

    function maxOffset() {
      return Math.max(0, bar.clientWidth - lensWidth());
    }

    function lensWidth() {
      return indicator.getBoundingClientRect().width;
    }

    function geometry(index) {
      var span = spanOf(index);
      var width = lensWidth();
      var offset = span.offset + (span.width - width) / 2;
      return {
        index: index,
        offset: limit(offset, 0, maxOffset()),
        width: width
      };
    }

    function paint(geom) {
      indicator.style.transform = "translate3d(" + geom.offset + "px, 0, 0)";
    }

    /* 不带过渡地直接放到目标位置（首次渲染、旋转屏幕时用） */
    function place(index) {
      indicator.style.transition = "none";
      paint(geometry(index, false));
      void indicator.offsetWidth; // 强制回流，让位置立刻生效
      indicator.style.transition = "";
    }

    function centerOf(index) {
      var span = spanOf(index);
      return span.offset + span.width / 2;
    }

    function nearestIndex(offset, width) {
      var center = offset + width / 2;
      var best = 0;
      var bestDistance = Infinity;
      for (var k = 0; k < buttons.length; k++) {
        var distance = Math.abs(centerOf(k) - center);
        if (distance < bestDistance) {
          bestDistance = distance;
          best = k;
        }
      }
      return best;
    }

    /* 手指落在哪一格上（指针捕获之后浏览器不再把 click 派发给按钮，点按要自己算） */
    function indexAtX(x) {
      for (var k = 0; k < buttons.length; k++) {
        var span = spanOf(k);
        if (x >= span.offset && x <= span.offset + span.width) return k;
      }
      var width = spanOf(0).width;
      return nearestIndex(limit(x - width / 2, 0, maxOffset()), width); // 落在间隙里就取最近的一格
    }

    /* 换页时：先从旧位置拉伸着滑过去，再收拢落位 */
    var previous = ui.tabGeom;
    var shouldAnimate = previous && previous.index !== activeIndex;
    if (shouldAnimate) {
      indicator.style.transition = "none";
      paint(previous);
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          indicator.style.transition = "";
          paint(geometry(activeIndex));
        });
      });
    } else {
      place(activeIndex);
    }
    ui.tabGeom = geometry(activeIndex);

    bar.__sync = function () {
      place(activeIndex);
      ui.tabGeom = geometry(activeIndex);
    };

    bar.addEventListener("pointermove", function (event) {
      var rect = bar.getBoundingClientRect();
      bar.style.setProperty("--pointer-x", (event.clientX - rect.left) + "px");
      bar.style.setProperty("--pointer-y", (event.clientY - rect.top) + "px");
    });

    bar.addEventListener("pointerleave", function () {
      bar.style.setProperty("--pointer-x", "50%");
      bar.style.setProperty("--pointer-y", "50%");
    });

    /* ---- 拖动底栏 ---- */
    var startX = 0;
    var startOffset = 0;
    var dragging = false;
    var moved = false;

    bar.addEventListener("pointerdown", function (event) {
      if (event.button) return;
      startX = event.clientX;
      startOffset = indicator.getBoundingClientRect().left - bar.getBoundingClientRect().left - bar.clientLeft;
      dragging = true;
      moved = false;
      indicator.style.transition = "none";
      if (bar.setPointerCapture) bar.setPointerCapture(event.pointerId);
    });

    bar.addEventListener("pointermove", function (event) {
      if (!dragging) return;
      var dx = event.clientX - startX;
      if (!moved && Math.abs(dx) < 6) return;
      moved = true;
      bar.classList.add("dragging");
      var geom = {
        offset: limit(startOffset + dx, 0, maxOffset()),
        width: lensWidth()
      };
      paint(geom);
      var near = nearestIndex(geom.offset, geom.width);
      for (var k = 0; k < buttons.length; k++) {
        buttons[k].classList.toggle("near", k === near);
      }
    });

    function endDrag(event) {
      if (!dragging) return;
      dragging = false;
      indicator.style.transition = "";
      bar.classList.remove("dragging");
      for (var k = 0; k < buttons.length; k++) buttons[k].classList.remove("near");
      var width = lensWidth();

      if (!moved) {
        // 点按：按松手位置判断点了哪一格
        // 指针捕获会把事件目标换成栏本身，所以按坐标找手指下面真正是什么
        var under = document.elementFromPoint ? document.elementFromPoint(event.clientX, event.clientY) : null;
        var createHit = under && under.closest ? under.closest(".tab-create") : null;
        var tapIndex = indexAtX(event.clientX - bar.getBoundingClientRect().left - bar.clientLeft);
        place(activeIndex);
        if (createHit) {
          // 指针捕获之后浏览器不再把 click 交给按钮，这里自己接住「+」
          ui.suppressTabClick = Date.now() + 400;
          openPresetPicker();
          return;
        }
        // 在习惯详情页时，点「打卡」也要回到列表，所以不能只比“是否当前页签”
        if (tapIndex !== activeIndex || state.view === "detail") goTo(TABS[tapIndex].key);
        return;
      }

      var offset = limit(startOffset + (event.clientX - startX), 0, maxOffset());
      var index = nearestIndex(offset, width);
      ui.suppressTabClick = Date.now() + 500;
      ui.tabGeom = { index: index, offset: offset, width: width };
      paint(ui.tabGeom);
      if (index === activeIndex && state.view !== "detail") {
        render(); // 弹回原位
      } else {
        goTo(TABS[index].key);
      }
    }

    bar.addEventListener("pointerup", endDrag);
    bar.addEventListener("pointercancel", endDrag);
  }

  function costSummaryText(habits, now) {

  }).join("");

  var CAL_LEGEND =
    '<div class="legend">' +
    '<span><i class="sw sw-done"></i>打卡</span>' +
    '<span><i class="sw sw-urge"></i>有冲动</span>' +
    '<span><i class="sw sw-relapse"></i>破戒</span>' +

  var MONTH_NAMES = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];

  /* 月历：大号月份标题 + 周行 + 每天"数字 + 状态标记"。
     打卡的样式是"数字后面一个实心圆、日期反色"，所以日期永远不会被盖住。 */
  function monthCalendarHTML(habit, year, month, now) {
    var cells = L.monthGrid(habit, year, month, now);
    var todayKey = L.dayKey(now);
    /* 注意：这里保持成"每格一个字符串"的数组，
       按周切行时切数组，别切拼好的字符串（切字符串会把标签截断） */
    var dayCells = cells
      .map(function (cell) {
        if (cell.blank) return '<span class="day blank"></span>';

        var classes = ["day", cell.level];
        if (cell.key === todayKey) classes.push("today");
        if (ui.pulse && ui.pulse.id === habit.id && ui.pulse.key === cell.key) classes.push("pulse");

        var tip =
          cell.key +
          (cell.checkin ? " · 已打卡" : cell.future ? "" : " · 点一下打卡") +
          (cell.urges ? " · 冲动 " + cell.urges + " 次" : "") +
          (cell.relapses ? " · 破戒" : "");
        var attrs = cell.future
          ? ' disabled aria-label="' + esc(cell.key + "（还没到）") + '"'
          : ' data-act="toggle-day" data-id="' +
            habit.id +
            '" data-key="' +
            cell.key +
            '" aria-label="' +
            esc(cell.key + (cell.checkin ? " 已打卡，不能取消" : " 没打卡，点一下打卡")) +
            '"';

        return (
          '<button type="button" class="' +
          classes.join(" ") +
          '" title="' +
          esc(tip) +
          '"' +
          attrs +
          '><span class="day-num">' +
          cell.day +
          '</span><span class="day-mark"></span></button>'
        );
      });

    // 按周切行，方便画每周之间的细分隔线
    var weeks = "";
    for (var i = 0; i < dayCells.length; i += 7) {
      weeks += '<div class="cal-week">' + dayCells.slice(i, i + 7).join("") + "</div>";
    }

    return (
      '<div class="cal-head">' +
      '<button class="icon-btn" data-act="month-prev" aria-label="上个月">‹</button>' +
      '<span class="cal-year">' +
      year +
      " 年</span>" +
      '<button class="icon-btn" data-act="month-next" aria-label="下个月">›</button>' +
      '<button class="link-btn" data-act="month-now">回到本月</button>' +
      "</div>" +
      '<h2 class="cal-title">' +
      MONTH_NAMES[month] +
      "</h2>" +
      '<div class="cal-weekdays">' +
      WEEKDAY_ROW +
      "</div>" +
      '<div class="cal-weeks">' +
      weeks +
      "</div>"
    );
  }

        var classes = ["mini-day"];
        if (cell.future) classes.push("future");
        if (cell.checkin) classes.push("done");
        if (cell.relapses) classes.push("relapse");
        else if (cell.urges) classes.push("urge");
        /* 一天一个元素（原来还套了一层 <i>，年视图会有 700 多个节点拖慢渲染） */
        return '<span class="' + classes.join(" ") + '">' + cell.day + "</span>";
      })
      .join("");
    return (
      '<button class="mini" data-act="goto-month" data-month="' +
      item.month +
