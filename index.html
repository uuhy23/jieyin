<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale + user-scalable=no：禁止双击/双指放大（Android 生效，
         iOS 出于无障碍会忽略这两个，所以样式里还有一层 touch-action） -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e1116" id="themeColor" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="解瘾 · 不良嗜好戒断助手：戒断计时、冲动急救、省钱与身体恢复里程碑。数据只存在本机。" />
    <title>解瘾 · 不良嗜好戒断助手</title>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="statusBarStyle" />
    <meta name="apple-mobile-web-app-title" content="解瘾" />
    <style>
:root {
  /* 配色对齐 iOS 深色模式：纯黑底 + 两级灰卡片，靠留白和层级说话，不靠描边 */
  --bg: #000000;
  --bg-soft: #000000;
  --card: #1c1c1e;
  --card-2: #2c2c2e;
  --line: rgba(255, 255, 255, 0.08);
  --text: #ffffff;
  --muted: #8e8e93;
  /* 统一为黑白色调：强调色就是"墨色"（深色下是白、浅色下是黑），
     其余状态色一律用明度区分，不再引入色相 */
  --accent: #ffffff;
  --accent-ink: #000000;
  --warn: rgba(255, 255, 255, 0.42);
  --danger: rgba(255, 255, 255, 0.24);
  --info: rgba(255, 255, 255, 0.6);
  --shadow: none;
  --radius: 20px;
  --glass-bg: rgba(30, 38, 50, 0.5);
  --glass-edge: rgba(255, 255, 255, 0.14);
  --glass-sheen: rgba(255, 255, 255, 0.2);
  --glass-active: rgba(255, 255, 255, 0.15);

  /* ---- 液态玻璃：所有可调参数都在这里，搬到 React / Vue / Svelte 只需要复制这一段 ---- */
  --lg-blur: 14px; /* 磨砂程度 */
  --lg-saturate: 175%; /* 背后颜色的饱和度提升 */
  --lg-refract-band: 22; /* 边缘折射带的宽度（像素），越大越柔 */
  --lg-refract-strength: 0.12; /* 边缘最多把画面朝中心拉多少（0.04 很含蓄，0.2 很夸张） */
  --lg-tint: rgba(120, 120, 128, 0.22); /* 中性灰的玻璃：比页面亮一点，选中项的深色胶囊才看得出来 */
  --lg-line: rgba(255, 255, 255, 0.1); /* 一圈发丝边 */
  --lg-line-light: rgba(255, 255, 255, 0.5); /* 边缘高光 */
  --lg-line-soft: rgba(255, 255, 255, 0.1);
  --lg-sheen: rgba(255, 255, 255, 0.22);
  --lg-shadow: 0 10px 26px rgba(0, 0, 0, 0.26);
  --lg-gloss-opacity: 0.6;
  --lg-capsule: rgba(0, 0, 0, 0.72); /* 选中项的凹陷胶囊 */
}

[data-theme="light"] {
  /* iOS 浅色模式的分组背景 + 白卡片 */
  --bg: #f2f2f7;
  --bg-soft: #f2f2f7;
  --card: #ffffff;
  --card-2: #e5e5ea;
  --line: rgba(60, 60, 67, 0.12);
  --text: #000000;
  --muted: #8a8a8e;
  --accent: #000000;
  --accent-ink: #ffffff;
  --warn: rgba(0, 0, 0, 0.42);
  --danger: rgba(0, 0, 0, 0.24);
  --info: rgba(0, 0, 0, 0.6);
  --glass-bg: rgba(255, 255, 255, 0.6);
  --glass-edge: rgba(15, 23, 42, 0.08);
  --glass-sheen: rgba(255, 255, 255, 0.95);
  --glass-active: rgba(15, 23, 42, 0.07);

  --lg-tint: rgba(255, 255, 255, 0.5);
  --lg-line: rgba(255, 255, 255, 0.6);
  --lg-line-light: rgba(255, 255, 255, 0.95);
  --lg-line-soft: rgba(15, 23, 42, 0.06);
  --lg-sheen: rgba(255, 255, 255, 0.9);
  --lg-shadow: 0 14px 34px rgba(15, 23, 42, 0.14);
  --lg-gloss-opacity: 0.5;
  --lg-capsule: rgba(120, 120, 128, 0.2); /* 浅色下用浅灰凹陷，白底上才看得出来 */
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

/* ---------- 像原生 App 一样的操作手感 ---------- */

html,
body {
  /* pan-x pan-y 里不含 pinch-zoom：双指缩放和双击缩放都交给页面自己处理，
     滚动仍然正常。这是 iOS 上唯一真正生效的禁止缩放方式。 */
  touch-action: pan-x pan-y;
  /* 去掉下拉刷新和滚动到头的橡皮筋回弹 */
  overscroll-behavior: none;
  /* 横屏时不要自动放大字号 */
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  /* 原生 App 里点按不会选中文字、也不会有灰色点击高亮 */
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* 输入框仍然要能选中、能长按粘贴 */
input,
textarea {
  -webkit-user-select: text;
  user-select: text;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

body.modal-open {
  overflow: hidden;
}

/* ---------- 液态玻璃：一块玻璃需要的全部东西 ---------- */

.glass {
  position: relative;
  background: var(--lg-tint);
  border: 1px solid var(--lg-line);
  box-shadow: var(--lg-shadow), inset 0 1px 0 var(--lg-sheen);
  /* 不支持 url() 滤镜的浏览器（Safari / Firefox）停在这一行，只有磨砂 */
  -webkit-backdrop-filter: blur(var(--lg-blur)) saturate(var(--lg-saturate));
  backdrop-filter: blur(var(--lg-blur)) saturate(var(--lg-saturate));
}

/* 边缘那道“底层透上来的光”：1.5px 的渐变描边，用遮罩抠成一圈 */
.glass::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1.5px;
  background: linear-gradient(
    135deg,
    transparent 0%,
    var(--lg-line-soft) 26%,
    var(--lg-line-light) 62%,
    transparent 100%
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  mix-blend-mode: screen;
  opacity: 0.75;
  pointer-events: none;
  z-index: 4;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

h1,
h2,
h3 {
  margin: 0 0 8px;
  line-height: 1.35;
}

h2 {
  font-size: 20px;
}

h3 {
  font-size: 16px;
}

p {
  margin: 0 0 10px;
}

.muted {
  color: var(--muted);
}

.small {
  font-size: 13px;
}

.center {
  text-align: center;
}

.mono {
  font-variant-numeric: tabular-nums;
}

/* ---------- 顶部标题栏 ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: grid;
  /* 左右留等宽占位，中间的标题才是真的居中 */
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  /* 加上安全区，避免在「添加到主屏幕」的独立窗口里被手机状态栏压住 */
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 12px;
  /* 顶栏做成不透明的：像 Threads 那样。半透明 + 模糊紧贴状态栏时
     会把下面的内容糊成一团脏影，而这里本来也不需要透视 */
  background: var(--bg);
  border-bottom: 1px solid transparent;
  box-shadow: inset 0 -1px 0 var(--lg-line);
}

.bar-title {
  min-width: 0;
  max-width: 100%;
  font-size: 16px;
  font-weight: 600;
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bar-side {
  min-width: 0;
}

.icon-btn {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 10px;
  width: 38px;
  height: 34px;
  display: grid;
  place-items: center;
  font-size: 16px;
  transition: transform 0.18s cubic-bezier(0.3, 1.3, 0.5, 1);
}

.icon-btn:hover {
  transform: scale(1.08);
}

/* ---------- 底部悬浮导航（液态玻璃） ---------- */

.tabbar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
  /* 拉满宽度，图标均匀摊开（和 Threads 那条一致） */
  width: calc(100% - 24px);
  max-width: 460px;
  display: flex;
  align-items: center;
  gap: 4px;
  /* 左右内边距要大于胶囊的加宽量（PILL_EXTRA = 10），
     否则最左/最右时胶囊的横向留白会被压到贴边，和上下不等距 */
  padding: 6px 14px;
  border-radius: 999px;
  overflow: hidden;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  box-shadow: var(--lg-shadow), inset 0 1px 0 var(--lg-sheen),
    inset 0 -1px 0 color-mix(in srgb, var(--lg-line) 70%, transparent);
}

/* 会流动的高亮胶囊 */
.tab-indicator {
  position: absolute;
  left: 0;
  top: 6px;
  height: calc(100% - 12px);
  width: 0;
  border-radius: 999px;
  /* 选中项是"凹进去"的深色胶囊（参考图二），不是白色高光 */
  background: var(--lg-capsule);
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.4),
    inset 0 -1px 0 color-mix(in srgb, var(--lg-line-light) 22%, transparent);
  /* 对应 glassEffectID：形状在新旧位置之间流动，弹性收尾 */
  transition: transform 0.38s cubic-bezier(0.3, 1.34, 0.46, 1), width 0.38s cubic-bezier(0.3, 1.34, 0.46, 1);
  pointer-events: none;
  z-index: 1;
}

.tabbar.dragging .tab-indicator {
  transition: none;
}

/* 光泽层：上沿一道高光 + 下缘两条负扩散的 inset 高光（月牙形），
   模拟光从玻璃底下透上来，也就是那篇文章里让玻璃"活"起来的关键一层。 */
.glass::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  z-index: 3;
  opacity: var(--lg-gloss-opacity, 0.5);
  background: linear-gradient(180deg, color-mix(in srgb, var(--lg-sheen) 60%, transparent), transparent 46%);
  box-shadow: inset -10px -8px 0 -11px var(--lg-line-light), inset 0 -9px 0 -8px var(--lg-line-light),
    inset 0 1px 0 var(--lg-sheen);
}

.tab-btn {
  position: relative;
  z-index: 2;
  /* 等分伸展：栏越宽，图标摊得越开 */
  flex: 1 1 0;
  min-width: 0;
  height: 54px;
  display: grid;
  align-content: center;
  justify-items: center;
  gap: 0;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  /* 未选中也保持明亮的浅灰，像 iOS 那样图标不发灰 */
  color: color-mix(in srgb, var(--text) 78%, transparent);
  transition: color 0.22s ease, transform 0.12s ease;
}

.tab-btn:active {
  transform: scale(0.96);
}

.tab-glyph {
  position: relative;
  display: grid;
  place-items: center;
}

.tab-icon {
  width: 28px;
  height: 28px;
  transition: transform 0.34s cubic-bezier(0.3, 1.3, 0.5, 1);
}

.icon-solid {
  display: none;
}

.tab-btn.active .icon-outline {
  display: none;
}

.tab-btn.active .icon-solid {
  display: block;
}

/* 红色小圆点：对应参考里的 badge */
.tab-badge {
  position: absolute;
  top: -1px;
  right: -3px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  /* 黑白配色下靠"实心墨点"来提示（保留 NotificationBadge 的描边结构） */
  background: var(--text);
  border: 1px solid color-mix(in srgb, var(--bg) 70%, transparent);
  box-shadow: 0 0 3px color-mix(in srgb, var(--text) 30%, transparent);
}

/* 中间那个「+」：光秃秃的加号，没有底盘（参考图二） */
.tab-create {
  position: relative;
  z-index: 2;
  flex: 0 0 auto;
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--text);
  transition: transform 0.22s cubic-bezier(0.3, 1.35, 0.5, 1), color 0.2s ease;
}

.tab-create svg {
  width: 33px; /* 比页签图标略大，和参考一致 */
  height: 33px;
}

.tab-create:active {
  transform: scale(1.12); /* 对应 CreateButton 选中时的 scaleEffect(1.12) */
  color: var(--accent);
}

.tab-btn.active,
.tab-btn.near {
  /* 导航保持单色（和 Threads 一致）：选中只是变实、变亮，不换成强调色 */
  color: var(--text);
}

.tab-btn.active .tab-icon {
  transform: scale(1.04); /* 对应 scaleEffect(isSelected ? 1.04 : 1.0) */
  stroke-width: 2.2; /* 选中时笔画更粗，像 iOS 那样更“实” */
}

/* ---------- 布局 ---------- */

.main {
  max-width: 960px;
  margin: 0 auto;
  /* 底部要给悬浮导航栏留出位置 */
  padding: 20px 18px calc(104px + env(safe-area-inset-bottom, 0px));
  display: grid;
  gap: 16px;
}

/* ---------- 动效 ---------- */

/* 换页：整页淡入 + 轻微放大，对应参考里的
   .transition(.opacity.combined(with: .scale(0.98))) + easeInOut(0.22) */
@keyframes pageIn {
  from {
    opacity: 0;
    transform: scale(0.98);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.main.anim-in {
  animation: pageIn 0.22s ease-in-out both;
}

/* 进度条在进场时自己长出来 */
@keyframes barGrow {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}

.main.anim-in .progress-bar {
  transform-origin: left center;
  animation: barGrow 0.75s cubic-bezier(0.22, 0.9, 0.3, 1) both;
}

/* 下一个里程碑的圈轻轻呼吸 */
@keyframes breathe {
  0%,
  100% {
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  50% {
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 12%, transparent);
  }
}

.timeline li.next .dot {
  animation: breathe 2.6s ease-in-out infinite;
}

/* 打完卡那一下：按钮弹、格子亮 */
@keyframes popIn {
  0% {
    transform: scale(1);
  }
  45% {
    transform: scale(1.07);
  }
  100% {
    transform: scale(1);
  }
}

.row-habit.just-checked .check-btn {
  animation: popIn 0.42s cubic-bezier(0.3, 1.4, 0.5, 1) both;
}

/* 打完卡整行放大一下，不做光晕 */
.row-habit.just-checked {
  animation: rowZoom 0.46s cubic-bezier(0.3, 1.45, 0.5, 1) both;
}

@keyframes rowZoom {
  0% {
    transform: scale(1);
  }
  42% {
    transform: scale(1.035);
  }
  100% {
    transform: scale(1);
  }
}

/* 选中项统一用“放大一下”来反馈 */
@keyframes selectPop {
  0% {
    transform: scale(0.93);
  }
  58% {
    transform: scale(1.07);
  }
  100% {
    transform: scale(1);
  }
}

.seg-btn.active,
.chip.selected {
  animation: selectPop 0.36s cubic-bezier(0.3, 1.45, 0.5, 1) both;
}

@keyframes cellPulse {
  0% {
    transform: scale(0.82);
  }
  55% {
    transform: scale(1.18);
  }
  100% {
    transform: scale(1);
  }
}

/* 标语换一句时淡进来 */
@keyframes sloganIn {
  from {
    opacity: 0;
    transform: translateY(7px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.slogan-text.slogan-in {
  animation: sloganIn 0.4s cubic-bezier(0.22, 0.9, 0.3, 1) both;
}

/* 图标选中时弹一下 */
@keyframes iconPop {
  0% {
    transform: scale(0.84);
  }
  58% {
    transform: scale(1.16);
  }
  100% {
    transform: scale(1.1);
  }
}

.tab-btn.active .tab-icon {
  animation: iconPop 0.44s cubic-bezier(0.3, 1.4, 0.5, 1) both;
}

/* 按压时的轻微反馈 */
.row-habit .habit-emoji {
  transition: transform 0.18s cubic-bezier(0.3, 1.3, 0.5, 1);
}

.row-habit:active .habit-emoji {
  transform: scale(1.1) rotate(-4deg);
}

.row-main:active b {
  opacity: 0.75;
}

/* 系统开了「减少动态效果」就全部关掉 */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

.card {
  background: var(--card);
  border: 1px solid transparent;
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.summary.wrap {
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}

.sum {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: grid;
  gap: 2px;
}

.sum .k {
  color: var(--muted);
  font-size: 12.5px;
}

.sum .v {
  font-size: 19px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.sum .sub {
  color: var(--muted);
  font-size: 12px;
}

/* ---------- 首页的习惯行 ---------- */

.summary-line {
  margin: -4px 2px 0;
}

.rows {
  display: grid;
  gap: 10px;
}

.row-habit {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 12px 12px 14px;
  background: var(--card);
  border: 1px solid transparent;
  border-radius: var(--radius);
  transition: transform 0.18s cubic-bezier(0.3, 1.3, 0.5, 1);
}

.row-habit.checked {
  border-color: transparent;
}

.row-habit:active {
  transform: scale(1.015);
}

.row-main {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 0;
  background: transparent;
  padding: 4px 0;
  text-align: left;
}

.row-text {
  display: grid;
  min-width: 0;
}

.row-text b {
  font-size: 16px;
}

.row-text span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.check-btn {
  flex: 0 0 auto;
  min-width: 78px;
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 600;
}

/* ---------- 月历 ---------- */

.cursor-bar,
.cal-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.cursor-label,
.cal-year {
  font-size: 16px;
  min-width: 104px;
  text-align: center;
}

.cursor-bar .small-btn,
.cal-head .small-btn {
  margin-left: auto;
}

.cursor-bar .link-btn,
.cal-head .link-btn {
  margin-left: auto;
}

/* 大号月份标题（对应系统日历那种"九月"） */
.cal-title {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 0.5px;
  margin: 0 0 14px;
}

.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  padding-bottom: 6px;
}

.cal-weeks {
  display: grid;

  function pad2(n) {

    <script>
/* glass.js — 液态玻璃（框架无关：一条 <script> + 一组 CSS 变量）
 *
 * 思路来自 Shu Ding 的 liquid-glass / liquid-diamond（SVG 位移滤镜那一路）：
 *   1. 用 canvas 按元素自己的尺寸和圆角，逐像素算出一张位移贴图：
 *      R 通道存 X 位移、G 通道存 Y 位移，0.5 表示不动；
 *      "离边缘越近，采样点越往中心拉"，形成边缘的凸起折射；
 *   2. 这张贴图交给 feDisplacementMap，作为 backdrop-filter 作用在元素背后；
 *   3. 模糊和饱和度也放在滤镜内部，避免和 url() 抢同一条 backdrop-filter。
 *
 * 用法：容器加 .glass 类即可，脚本会自动扫描、按尺寸生成贴图，
 *      尺寸变化（转屏、拉伸）时自动重算。
 * 调参：CSS 变量 --lg-*（见 styles.css 的 :root）。
 */
(function () {
  "use strict";

  var FILTER_ID = "lg-refract";
  var SVG_ID = "lg-glass-defs";
  /* 贴图是一张平滑的位移场，不需要按屏幕像素精度来算：
     限制采样密度可以显著降低每次重算的开销（切页时的"卡一下"就来自这里） */
  var MAP_DPI = Math.min(1.5, window.devicePixelRatio || 1);
  var MAP_MAX_WIDTH = 480;

  var svg = null;
  var feMap = null;
  var feDisp = null;
  var feBlur = null;
  var feSat = null;
  var current = null; // 当前贴图对应的签名，避免重复计算

  /* ---------- 数学小工具（和参考实现一致） ---------- */

  function clamp(value, min, max) {
    return value < min ? min : value > max ? max : value;
  }

  function smoothStep(a, b, t) {
    t = clamp((t - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  }

  /* 圆角矩形的有符号距离：内部为负、边缘为 0、外部为正 */
  function roundedRectSDF(x, y, halfWidth, halfHeight, radius) {
    var qx = Math.abs(x) - halfWidth + radius;
    var qy = Math.abs(y) - halfHeight + radius;
    var outside = Math.sqrt(Math.max(qx, 0) * Math.max(qx, 0) + Math.max(qy, 0) * Math.max(qy, 0));
    return Math.min(Math.max(qx, qy), 0) + outside - radius;
  }

  function cssNumber(name, fallback) {
    var raw = getComputedStyle(document.documentElement).getPropertyValue(name);
    var value = parseFloat(raw);
    return isFinite(value) ? value : fallback;
  }

  /* ---------- 生成位移贴图 ---------- */

  function buildMapData(width, height, radius, band, strength) {
    var scaleToFit = Math.min(1, MAP_MAX_WIDTH / Math.max(1, width));
    var dpi = MAP_DPI * scaleToFit;
    var w = Math.max(1, Math.round(width * dpi));
    var h = Math.max(1, Math.round(height * dpi));
    var bandPx = Math.max(1, band * dpi);
    var halfW = w / 2;
    var halfH = h / 2;
    var r = Math.min(radius * dpi, halfH, halfW);

    var canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    var ctx = canvas.getContext("2d");
    var image = ctx.createImageData(w, h);
    var data = image.data;
    var deltas = new Float32Array(w * h * 2);
    var maxDelta = 0;

    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var dx = x + 0.5 - halfW;
        var dy = y + 0.5 - halfH;
        var distance = -roundedRectSDF(dx, dy, halfW, halfH, r); // 距边缘的深度，内部为正
        var weight = 1 - smoothStep(0, bandPx, distance); // 贴边处最强，深入内部衰减到 0
        var pull = weight * strength;
        var moveX = dx * -pull; // 朝中心拉
        var moveY = dy * -pull;
        var index = (y * w + x) * 2;
        deltas[index] = moveX;
        deltas[index + 1] = moveY;
        var magnitude = Math.max(Math.abs(moveX), Math.abs(moveY));
        if (magnitude > maxDelta) maxDelta = magnitude;
      }
    }

    var scale = maxDelta > 0 ? maxDelta : 1;
    for (var i = 0, p = 0; p < deltas.length; i += 4, p += 2) {
      // 0.5 是"不动"，向两侧展开
      data[i] = Math.round((deltas[p] / scale + 0.5) * 255);
      data[i + 1] = Math.round((deltas[p + 1] / scale + 0.5) * 255);
      data[i + 2] = 128;
      data[i + 3] = 255;
    }
    ctx.putImageData(image, 0, 0);
    return { url: canvas.toDataURL(), scale: scale / dpi };
  }

  /* ---------- SVG 滤镜 ---------- */

  function ensureSvg() {
    if (svg) return;
    var NS = "http://www.w3.org/2000/svg";
    svg = document.createElementNS(NS, "svg");
    svg.setAttribute("id", SVG_ID);
    svg.setAttribute("width", "0");
    svg.setAttribute("height", "0");
    svg.setAttribute("aria-hidden", "true");
    svg.style.cssText = "position:absolute;pointer-events:none";

    var defs = document.createElementNS(NS, "defs");
    var filter = document.createElementNS(NS, "filter");
    filter.setAttribute("id", FILTER_ID);
    filter.setAttribute("color-interpolation-filters", "sRGB");
    filter.setAttribute("x", "-20%");
    filter.setAttribute("y", "-20%");
    filter.setAttribute("width", "140%");
    filter.setAttribute("height", "140%");

    feBlur = document.createElementNS(NS, "feGaussianBlur");
    feBlur.setAttribute("in", "SourceGraphic");
    feBlur.setAttribute("result", "BLURRED");
    feBlur.setAttribute("stdDeviation", "0");

    feSat = document.createElementNS(NS, "feColorMatrix");
    feSat.setAttribute("type", "saturate");
    feSat.setAttribute("values", "1");

    feMap = document.createElementNS(NS, "feImage");
    feMap.setAttribute("x", "0");
    feMap.setAttribute("y", "0");
    feMap.setAttribute("preserveAspectRatio", "none");
    feMap.setAttribute("result", "MAP");

    feDisp = document.createElementNS(NS, "feDisplacementMap");
    feDisp.setAttribute("in", "BLURRED");
    feDisp.setAttribute("in2", "MAP");
    feDisp.setAttribute("xChannelSelector", "R");
    feDisp.setAttribute("yChannelSelector", "G");
    feDisp.setAttribute("scale", "0");

    filter.appendChild(feBlur);
    filter.appendChild(feSat);
    filter.appendChild(feMap);
    filter.appendChild(feDisp);
    defs.appendChild(filter);
    svg.appendChild(defs);
    document.body.appendChild(svg);
  }

  function supportsBackdropUrl() {
    if (!window.CSS || !CSS.supports) return false;
    return CSS.supports("backdrop-filter", "url(#a)") || CSS.supports("-webkit-backdrop-filter", "url(#a)");
  }

  /* ---------- 应用到元素 ---------- */

  function applyTo(el) {
    ensureSvg();
    var rect = el.getBoundingClientRect();
    if (rect.width < 4 || rect.height < 4) return; // 还没布局

    var radius = parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0;
    var band = cssNumber("--lg-refract-band", 20);
    var strength = cssNumber("--lg-refract-strength", 0.12);
    var blur = cssNumber("--lg-blur", 14);
    var saturate = cssNumber("--lg-saturate", 175) / 100;

    // 尺寸按 4px 取整：滚动条出现之类造成的 1px 变化不值得重算贴图
    var signature =
      Math.round(rect.width / 4) * 4 +
      "x" +
      Math.round(rect.height / 4) * 4 +
      ":" +
      radius +
      ":" +
      band +
      ":" +
      strength +
      ":" +
      blur +
      ":" +
      saturate;
    if (signature !== current) {
      var map = buildMapData(rect.width, rect.height, radius, band, strength);
      feMap.setAttribute("width", String(rect.width));
      feMap.setAttribute("height", String(rect.height));
      feMap.setAttributeNS("http://www.w3.org/1999/xlink", "href", map.url);
      feMap.setAttribute("href", map.url);
      feDisp.setAttribute("scale", String(map.scale));
      feBlur.setAttribute("stdDeviation", String(blur));
      feSat.setAttribute("values", String(saturate));
      current = signature;
    }

    if (supportsBackdropUrl()) {
      // 模糊、饱和度、折射都在这个滤镜里完成（Chromium）
      el.style.webkitBackdropFilter = "url(#" + FILTER_ID + ")";
      el.style.backdropFilter = "url(#" + FILTER_ID + ")";
    }
  }

  function scan() {
    var nodes = document.querySelectorAll(".glass");
    for (var i = 0; i < nodes.length; i++) applyTo(nodes[i]);
  }

  var scanTimer = null;
  function scheduleScan() {
    clearTimeout(scanTimer);
    scanTimer = setTimeout(scan, 60);
  }

  function start() {
    if (!document.body) return;
    scan();
    window.addEventListener("resize", scheduleScan);
    if (window.MutationObserver) {
      // 只盯住 #app 的直接子节点：切页签会把底栏整个重建，这时要重新贴一次样式。
      // 不递归观察子树，避免每秒计时器刷新也触发扫描。
      var app = document.getElementById("app");
      if (app) new MutationObserver(scheduleScan).observe(app, { childList: true });
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();

  // 想手动调用也行（框架里可以只留这一段）
  window.LiquidGlass = { apply: applyTo, refresh: scheduleScan, scan: scan };
})();

      raw = window.localStorage.getItem(STORAGE_KEY);
    } catch (err) {
      console.warn("无法读取本地存储", err);
      return s;
    }
    if (!raw) return s;
    try {
      var data = JSON.parse(raw);
      if (!data || typeof data !== "object") return s;
      s.theme = data.theme === "light" || data.theme === "dark" || data.theme === "system" ? data.theme : "system";
      s.view = ["detail", "month", "year", "settings"].indexOf(data.view) >= 0 ? data.view : "home";
      s.activeId = typeof data.activeId === "string" ? data.activeId : null;
      s.habits = Array.isArray(data.habits) ? data.habits.map(normalizeHabit) : [];
      s.slogans = normalizeSlogans(data.slogans);
      return s;
    } catch (err) {
      console.warn("本地数据损坏，已忽略", err);
      return s;
    }
  }

  var state = load();

  function save() {
    try {
      window.localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          version: 1,
          theme: state.theme,
          view: state.view,
          activeId: state.activeId,
          habits: state.habits,
          slogans: state.slogans
        })
      );
      return true;
    } catch (err) {
      console.error("保存失败", err);
      toast("保存失败：浏览器存储空间可能已满");
      return false;
    }
  }

  function getHabit(id) {
    for (var i = 0; i < state.habits.length; i++) {
      if (state.habits[i].id === id) return state.habits[i];
    }
    return null;
  }

  /* ==================== 工具 ==================== */

  function $(sel, root) {
    return (root || document).querySelector(sel);
  }

  function $$(sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  }

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var toastTimer = null;
  function toast(text) {
    var el = $("#toast");
    if (!el) return;
    el.textContent = text;
    el.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.classList.remove("show");
    }, 2600);
  }

  function toLocalInput(ts) {
    var d = new Date(ts);
    return (
      d.getFullYear() + "-" + L.pad2(d.getMonth() + 1) + "-" + L.pad2(d.getDate()) + "T" + L.pad2(d.getHours()) + ":" + L.pad2(d.getMinutes())
    );
  }

  function dateTimeText(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "/" + L.pad2(d.getMonth() + 1) + "/" + L.pad2(d.getDate()) + " " + L.pad2(d.getHours()) + ":" + L.pad2(d.getMinutes());
  }

  function timerInner(habit, now) {
    var parts = L.clockParts(L.currentStreakMs(habit, now));
    return '<b class="t-days">' + parts.days + '</b><span class="t-unit">天</span><span class="t-clock">' + parts.clock + "</span>";
  }

  /* ==================== 数据操作 ==================== */

  function toggleCheckin(id, ts) {
    var habit = getHabit(id);
    if (!habit) return;
    var now = Date.now();
    var key = L.dayKey(ts == null ? now : ts);
    var todayKey = L.dayKey(now);

    // 打卡后不能取消
    if (habit.checkins.indexOf(key) !== -1) {
      toast("已打卡，不能取消");
      return;
    }

    var backfillLeft = null;
    if (key !== todayKey) {
      var cursor = L.parseDayKey(key);
      if (!isNum(cursor)) return;
      if (cursor > L.startOfDay(now)) {
        toast(key + " 还没到，先过好今天");
        return;
      }
      // 补打卡要走配额：每月 5 次
      var stamp = new Date(now);
      var quota = L.backfillQuota(habit, stamp.getFullYear(), stamp.getMonth());
      if (!quota.allowed) {
        toast("本月补打卡机会已用完（每月 " + quota.limit + " 次）");
        return;
      }
      habit.edits.push({ at: now, key: key });
      backfillLeft = quota.left - 1;
    }

    habit.checkins.push(key);
    ui.pulse = { id: habit.id, key: key };
    tapFeedback(true);
    toast(
      key === todayKey
        ? "打卡完成：今天也守住了 💪"
        : key + " 已补打卡 ✓" + (backfillLeft !== null ? "（本月还剩 " + backfillLeft + " 次）" : "")
    );
    save();
    render();
  }

  function toggleDay(id, key) {
    var ts = L.parseDayKey(key);
    if (!isNum(ts)) return;
    toggleCheckin(id, ts); // 未到日期、取消、配额都在里面处理
  }

  function addUrge(id, data) {
    var habit = getHabit(id);
    if (!habit) return null;
    var rec = {
      at: Date.now(),
      trigger: String(data.trigger || "").trim(),
      intensity: Math.min(5, Math.max(1, Number(data.intensity) || 3)),
      note: String(data.note || "").trim(),
      resisted: data.resisted !== false
    };
    habit.urges.push(rec);
    save();
    return rec;
  }

  function addRelapse(id, note) {
    var habit = getHabit(id);
    if (!habit) return null;
    var streak = L.currentStreakMs(habit);
    habit.bestStreakMs = Math.max(habit.bestStreakMs, streak);
    var rec = { at: Date.now(), note: String(note || "").trim(), streakMs: streak };
    habit.relapses.push(rec);
    habit.cleanSince = Date.now();
    save();
    return rec;
  }

  function createHabit(data) {
    var now = Date.now();
    var habit = normalizeHabit({
      id: uid(),
      presetKey: data.presetKey,
      name: data.name,
      emoji: data.emoji,
      unit: data.unit,
      costType: data.costType,
      dailyCost: data.dailyCost,
      dailyAmount: data.dailyAmount,
      reason: data.reason,
      createdAt: now,
      cleanSince: data.cleanSince || now,
      milestones: L.presetMilestones(data.presetKey)
    });
    state.habits.unshift(habit);
    save();
    return habit;
  }

  function updateHabit(id, data) {
    var habit = getHabit(id);
    if (!habit) return;
    habit.name = data.name;
    habit.emoji = data.emoji;
    habit.unit = data.unit;
    habit.costType = data.costType;
    habit.dailyCost = data.dailyCost;
    habit.dailyAmount = data.dailyAmount;
    habit.reason = data.reason;
    habit.cleanSince = data.cleanSince;
    save();
  }

  function deleteHabit(id) {
    for (var i = 0; i < state.habits.length; i++) {
      if (state.habits[i].id === id) {
        state.habits.splice(i, 1);
        break;
      }
    }
    if (state.activeId === id) {
      state.activeId = null;
      state.view = "home";
    }
    save();
    render(true);
  }

  function goHome() {
    state.view = "home";
    save();
    render(true);
  }

  function goTo(view, id) {
    state.view = view;
    if (id !== undefined) state.activeId = id;
    save();
    render(true);
  }

  /* ==================== 弹窗 ==================== */

  function openModal(html, opts) {
    opts = opts || {};
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = '<div class="modal ' + (opts.size || "") + '">' + html + "</div>";
    document.body.appendChild(overlay);
    document.body.classList.add("modal-open");
    if (opts.backdropClose !== false) {
      overlay.addEventListener("mousedown", function (e) {
        if (e.target === overlay) closeModal(overlay);
      });
    }
    return overlay;
  }

  function closeModal(overlay) {
    if (!overlay) return;
    if (typeof overlay.__cleanup === "function") overlay.__cleanup();
    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    if (!$(".overlay")) document.body.classList.remove("modal-open");
  }

  function closeTopModal() {
    var all = $$(".overlay");
    if (all.length) closeModal(all[all.length - 1]);
  }

  function openSloganManager() {
    var overlay = openModal(
      "<h2>我的标语</h2>" +
        '<p class="muted small">自己写的句子最管用。它们会和内置标语一起轮换出现在首页，也会出现在急救呼吸引导里。</p>' +
        '<div data-slogan-list>' +
        sloganListHTML() +
        "</div>" +
        '<label class="field"><span>添加一句</span><input type="text" data-new-slogan maxlength="60" placeholder="例如：撑过这一分钟就够了"></label>' +
        '<div class="modal-foot">' +
        '<button class="btn ghost" data-slogan="close">关闭</button>' +
        '<button class="btn primary" data-slogan="add">添加</button>' +
        "</div>",
      {}
    );

    function refresh() {
      $("[data-slogan-list]", overlay).innerHTML = sloganListHTML();
    }

    overlay.addEventListener("click", function (e) {
      var del = e.target.closest("[data-slogan-del]");
      if (del) {
        state.slogans.splice(Number(del.getAttribute("data-slogan-del")), 1);
        save();
        refresh();
        render();
        toast("已删除");
        return;
      }
      var btn = e.target.closest("[data-slogan]");
      if (!btn) return;
      if (btn.getAttribute("data-slogan") === "close") {
        closeModal(overlay);
        return;
      }
      var input = $("[data-new-slogan]", overlay);
      var text = input.value.trim().slice(0, 60);
      if (!text) {
        toast("先写一句吧");
        return;
      }
      if (state.slogans.indexOf(text) !== -1) {
        toast("这句已经加过了");
        return;
      }
      if (state.slogans.length >= 50) {
        toast("最多存 50 句");
        return;
      }
      state.slogans.push(text);
      save();
      input.value = "";
      refresh();
      render();
      toast("已加入，会自动和内置标语轮换");
    });
  }

      "</div>" +

      "</div>" +

  function openHabitForm(habitId, presetKey) {
    var habit = habitId ? getHabit(habitId) : null;
    var preset = habit ? L.getPreset(habit.presetKey) || L.getPreset("other") : L.getPreset(presetKey) || L.getPreset("other");
    var overlay = openModal(habitFormHTML(habit, preset), {});
    var form = $(".form", overlay);

    function applyCostType(type) {
      var meta = L.getCostType(type);
      $$("[data-cost-type] .seg-btn", overlay).forEach(function (btn) {
        btn.classList.toggle("active", btn.getAttribute("data-type") === type);
      });
      $("[data-cost-hint]", overlay).textContent = meta.hint;
      $("[data-amount-label]", overlay).textContent = meta.fieldLabel;
      $("[data-unit-field]", overlay).style.display = type === "custom" ? "" : "none";
      $('[name="amount"]', form).placeholder = type === "money" ? "例如 20" : type === "time" ? "例如 2" : "例如 3";
    }

    function collect() {
      function val(sel) {
        return $('[name="' + sel + '"]', form).value.trim();
      }
      var name = val("name");
      if (!name) {
        toast("给这个目标起个名字吧");
        return null;
      }
      var activeSeg = $("[data-cost-type] .seg-btn.active", overlay);
      var costType = activeSeg ? activeSeg.getAttribute("data-type") : "money";
      var amount = Math.max(0, Number(val("amount")) || 0);
      var timeValue = val("cleanSince");
      var parsed = timeValue ? new Date(timeValue).getTime() : NaN;
      return {
        presetKey: habit ? habit.presetKey : preset.key,
        name: name,
        emoji: val("emoji") || preset.emoji,
        costType: costType,
        unit: costType === "time" ? "小时" : val("unit") || "次",
        dailyCost: costType === "money" ? amount : 0,
        dailyAmount: costType === "money" ? 0 : amount,
        reason: val("reason"),
        cleanSince: isNum(parsed) && parsed <= Date.now() + 60000 ? parsed : Date.now()
      };
    }

    overlay.addEventListener("click", function (e) {
      var seg = e.target.closest("[data-cost-type] .seg-btn");
      if (seg) {
        applyCostType(seg.getAttribute("data-type"));
        return;
      }
      var btn = e.target.closest("[data-form]");
      if (!btn) return;
      var action = btn.getAttribute("data-form");
      if (action === "cancel") {
        closeModal(overlay);
        return;
      }
      if (action === "submit") {
        var data = collect();
        if (!data) return;
        if (habit) {
          updateHabit(habit.id, data);
          closeModal(overlay);
          toast("已保存");
          render();
        } else {
          var created = createHabit(data);
          closeModal(overlay);
          toast("开始计时，随时可以来记一笔 👊");
          goTo("detail", created.id);
        }
      }
    });

    applyCostType(costTypeOfForm());

    function costTypeOfForm() {
      var active = $("[data-cost-type] .seg-btn.active", overlay);
      return active ? active.getAttribute("data-type") : "money";
    }
  }

    var overlay = openModal(
      "<h2>现在很想" + esc(habit.name) + "？</h2>" +
        '<p class="muted small">冲动像海浪，会涨也会退。我们只需要先撑过这一分钟，然后再决定。</p>' +
        '<div class="tip">' + esc(tip) + "</div>" +
        '<ul class="facts">' +
        "<li>先做一分钟呼吸，让身体从紧绷里退出来</li>" +
        "<li>记下是什么引爆了它</li>" +
        "<li>最后再决定要不要真的破戒</li>" +
        "</ul>" +
        '<div class="modal-foot">' +
        '<button class="btn ghost" data-sos="skip">跳过呼吸，直接记录</button>' +
        '<button class="btn primary" data-sos="start">开始一分钟呼吸</button>' +
        "</div>",
      { backdropClose: false }
    );

    var timers = [];
    overlay.__cleanup = function () {
      timers.forEach(clearTimeout);
      timers = [];
    };

    function logStep() {
      var wrap = document.createElement("div");
      wrap.innerHTML = logFormHTML(habit);
      overlay.innerHTML = '<div class="modal-body">' + wrap.innerHTML + "</div>";
      wireLogForm(overlay, habit);
    }

    function breathStep() {
      overlay.innerHTML =
        '<div class="modal-body">' +
        '<h3 class="center">跟着圆圈呼吸</h3>' +
        '<div class="breath-wrap"><div class="breath-circle" data-circle><span data-phase>准备</span></div></div>' +
        '<p class="center muted small" data-round>第 1 / 3 轮 · 吸气 4 秒，屏住 7 秒，呼气 8 秒</p>' +
        '<p class="center small slogan-inline">' + esc(L.pick(sloganPool())) + "</p>" +
        '<div class="modal-foot"><button class="btn ghost" data-sos="skip">跳过</button></div>' +
        "</div>";

      var circle = $("[data-circle]", overlay);
      var phaseEl = $("[data-phase]", overlay);
      var roundEl = $("[data-round]", overlay);
      var phases = [
        { label: "吸气", secs: 4, scale: 1.35 },
        { label: "屏住", secs: 7, scale: 1.35 },
        { label: "呼气", secs: 8, scale: 1 }
      ];
      var round = 0;
      var index = 0;

      function run() {
        if (round >= 3) {
          phaseEl.textContent = "很好";
          logStep();
          return;
        }
        var phase = phases[index];
        phaseEl.textContent = phase.label + " " + phase.secs;
        circle.style.transitionDuration = phase.secs + "s";
        circle.style.transform = "scale(" + phase.scale + ")";
        timers.push(
          setTimeout(function () {
            index++;
            if (index >= phases.length) {
              index = 0;
              round++;
              if (roundEl) roundEl.textContent = "第 " + Math.min(round + 1, 3) + " / 3 轮 · 你已经撑过 " + round * 19 + " 秒";
            }
            run();
          }, phase.secs * 1000)
        );
      }

      circle.style.transitionDuration = "0s";
      circle.style.transform = "scale(1)";
      timers.push(
        setTimeout(function () {
          run();
        }, 60)
      );
    }

    overlay.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-sos],[data-log]");
      if (!btn) return;
      var sos = btn.getAttribute("data-sos");
      if (sos === "start") {
        breathStep();
        return;
      }
      if (sos === "skip") {
        logStep();
        return;
      }
      var action = btn.getAttribute("data-log");
      if (action === "close") {
        closeModal(overlay);
        return;
      }
      var entry = readLogForm(overlay);
      var wrap = $(".modal-body", overlay) || overlay;
      if (action === "resist") {
        var streakBefore = L.currentStreakMs(habit);
        addUrge(habit.id, { trigger: entry.trigger, intensity: entry.intensity, note: entry.note, resisted: true });
        if (!L.isCheckedIn(habit, Date.now())) {
          habit.checkins.push(L.dayKey(Date.now()));
          save();
        }
        wrap.innerHTML = resistResultHTML(habit, entry, streakBefore);
        toast("扛过去一次，今天也帮你打卡了");
      } else {
        addUrge(habit.id, { trigger: entry.trigger, intensity: entry.intensity, note: entry.note, resisted: false });
        var relapse = addRelapse(habit.id, entry.note);
        wrap.innerHTML = gaveInResultHTML(habit, entry, relapse);
      }
      render();
    });
  }

  /* 底部悬浮的导航栏（苹果那种半透明玻璃质感） */
  function tabbarHTML() {
    var unfinished = state.habits.some(function (habit) {

    var items = TABS.map(function (tab, index) {

  /* 液态玻璃：高亮胶囊会从左滑到右，拖动底栏松手也能切 */
  function setupTabbar() {
    var bar = $(".tabbar");
    if (!bar) return;
    var indicator = $(".tab-indicator", bar);
    var buttons = $$(".tab-btn", bar);
    if (!indicator || buttons.length < 2) return;

    var activeIndex = 0;
    var i;
    for (i = 0; i < buttons.length; i++) {
      if (buttons[i].classList.contains("active")) activeIndex = i;
    }

    /* 选中胶囊比格子更宽，向两侧各多出一个内边距的量，做出 iOS 那种“盖住间隙”的玻璃块 */
    var PILL_EXTRA = 10;
    /* 胶囊离栏内边界的最小留白（px）：两端也要留着，否则看着像贴边 */
    var MIN_GAP = 4;

    function limit(value, min, max) {
      return value < min ? min : value > max ? max : value;
    }

    /* 胶囊的坐标原点在栏的 padding box 左上角，按钮的位置要用实测值，
       否则会差出一个内边距，第一个格溢出、最后一格短一块 */
    function originX() {
      return bar.getBoundingClientRect().left + bar.clientLeft;
    }

    function spanOf(index) {
      var rect = buttons[index].getBoundingClientRect();
      return { offset: rect.left - originX(), width: rect.width };
    }

    function maxOffset() {
      var pillWidth = spanOf(0).width + PILL_EXTRA * 2;
      return Math.max(MIN_GAP, bar.clientWidth - MIN_GAP - pillWidth);
    }

    function geometry(index, stretch) {
      var span = spanOf(index);
      var offset = span.offset - PILL_EXTRA;
      var width = span.width + PILL_EXTRA * 2;
      var extra = stretch ? width * 0.16 : 0;

      /* 整体平移到栏的内边界之内（不改变宽度），左右用同一个边界，
         所以两端看到的留白是对称的。 */
      var left = offset - extra / 2;
      var right = offset + width + extra / 2;
      var shift = 0;
      if (left < MIN_GAP) shift = MIN_GAP - left;
      else if (right > bar.clientWidth - MIN_GAP) shift = bar.clientWidth - MIN_GAP - right;
      return { index: index, offset: offset + shift, width: width };
    }

    function paint(geom) {
      indicator.style.width = geom.width + "px";
      indicator.style.transform = "translateX(" + geom.offset + "px)";
    }

    /* 不带过渡地直接放到目标位置（首次渲染、旋转屏幕时用） */
    function place(index) {
      indicator.style.transition = "none";
      paint(geometry(index, false));
      void indicator.offsetWidth; // 强制回流，让位置立刻生效
      indicator.style.transition = "";
    }

    function centerOf(index) {
      var span = spanOf(index);
      return span.offset + span.width / 2;
    }

    function nearestIndex(offset, width) {
      var center = offset + width / 2;
      var best = 0;
      var bestDistance = Infinity;
      for (var k = 0; k < buttons.length; k++) {
        var distance = Math.abs(centerOf(k) - center);
        if (distance < bestDistance) {
          bestDistance = distance;
          best = k;
        }
      }
      return best;
    }

    /* 手指落在哪一格上（指针捕获之后浏览器不再把 click 派发给按钮，点按要自己算） */
    function indexAtX(x) {
      for (var k = 0; k < buttons.length; k++) {
        var span = spanOf(k);
        if (x >= span.offset && x <= span.offset + span.width) return k;
      }
      var width = spanOf(0).width;
      return nearestIndex(limit(x - width / 2, 0, maxOffset()), width); // 落在间隙里就取最近的一格
    }

    /* 换页时：先从旧位置拉伸着滑过去，再收拢落位 */
    var previous = ui.tabGeom;
    var shouldAnimate = previous && previous.index !== activeIndex;
    if (shouldAnimate) {
      // 用 rAF 代替强制回流：避免每次切页都同步重排整个文档（那是"卡一下"的主因）
      indicator.style.transition = "none";
      paint(previous);
      requestAnimationFrame(function () {
        indicator.style.transition = "";
        indicator.style.transitionDuration = "0.34s";
        paint(geometry(activeIndex, true));
        clearTimeout(ui.tabTimer);
        ui.tabTimer = setTimeout(function () {
          indicator.style.transitionDuration = "";
          paint(geometry(activeIndex, false));
        }, 170);
      });
    } else {
      place(activeIndex);
    }
    ui.tabGeom = geometry(activeIndex, false);

    bar.__sync = function () {
      place(activeIndex);
      ui.tabGeom = geometry(activeIndex, false);
    };

    /* ---- 拖动底栏 ---- */
    var startX = 0;
    var startOffset = 0;
    var dragging = false;
    var moved = false;

    bar.addEventListener("pointerdown", function (event) {
      if (event.button) return;
      startX = event.clientX;
      startOffset = indicator.getBoundingClientRect().left - bar.getBoundingClientRect().left - bar.clientLeft;
      dragging = true;
      moved = false;
      indicator.style.transition = "none";
      if (bar.setPointerCapture) bar.setPointerCapture(event.pointerId);
    });

    bar.addEventListener("pointermove", function (event) {
      if (!dragging) return;
      var dx = event.clientX - startX;
      if (!moved && Math.abs(dx) < 6) return;
      moved = true;
      bar.classList.add("dragging");
      var geom = {
        offset: limit(startOffset + dx, 0, maxOffset()),
        width: spanOf(0).width + PILL_EXTRA * 2
      };
      paint(geom);
      var near = nearestIndex(geom.offset, geom.width);
      for (var k = 0; k < buttons.length; k++) {
        buttons[k].classList.toggle("near", k === near);
      }
    });

    function endDrag(event) {
      if (!dragging) return;
      dragging = false;
      indicator.style.transition = "";
      bar.classList.remove("dragging");
      for (var k = 0; k < buttons.length; k++) buttons[k].classList.remove("near");
      var width = spanOf(0).width + PILL_EXTRA * 2;

      if (!moved) {
        // 点按：按松手位置判断点了哪一格
        // 指针捕获会把事件目标换成栏本身，所以按坐标找手指下面真正是什么
        var under = document.elementFromPoint ? document.elementFromPoint(event.clientX, event.clientY) : null;
        var createHit = under && under.closest ? under.closest(".tab-create") : null;
        var tapIndex = indexAtX(event.clientX - bar.getBoundingClientRect().left - bar.clientLeft);
        place(activeIndex);
        if (createHit) {
          // 指针捕获之后浏览器不再把 click 交给按钮，这里自己接住「+」
          ui.suppressTabClick = Date.now() + 400;
          openPresetPicker();
          return;
        }
        // 在习惯详情页时，点「打卡」也要回到列表，所以不能只比“是否当前页签”
        if (tapIndex !== activeIndex || state.view === "detail") goTo(TABS[tapIndex].key);
        return;
      }

      var offset = limit(startOffset + (event.clientX - startX), 0, maxOffset());
      var index = nearestIndex(offset, width);
      ui.suppressTabClick = Date.now() + 500;
      ui.tabGeom = { index: index, offset: offset, width: width };
      paint(ui.tabGeom);
      if (index === activeIndex && state.view !== "detail") {
        render(); // 弹回原位
      } else {
        goTo(TABS[index].key);
      }
    }

    bar.addEventListener("pointerup", endDrag);
    bar.addEventListener("pointercancel", endDrag);
  }

  /* 首页一行一个习惯：点左边进详情，点右边直接打卡 */
  function habitRowHTML(habit, now) {
    var checked = L.isCheckedIn(habit, now);
    var justChecked = ui.pulse && ui.pulse.id === habit.id && ui.pulse.key === L.dayKey(now);
    return (
      '<div class="row-habit' + (checked ? " checked" : "") + (justChecked ? " just-checked" : "") + '">' +
      '<button class="row-main" data-act="open-habit" data-id="' + habit.id + '">' +
      '<span class="habit-emoji">' + esc(habit.emoji) + "</span>" +
      '<span class="row-text"><b>' + esc(habit.name) + '</b><span class="muted small" data-live="streak-text" data-id="' + habit.id + '">' + esc(habitSubText(habit, now)) + "</span></span>" +
      "</button>" +
      '<button class="btn check-btn ' + (checked ? "ok" : "primary") + '" data-act="toggle-checkin" data-id="' + habit.id + '">' +
      (checked ? "✓ 已打卡" : "打卡") +
      "</button>" +
      "</div>"
    );
  }

  function habitSubText(habit, now) {
    var text = "已坚持 " + L.formatDuration(L.currentStreakMs(habit, now));
    var cost = L.costAccum(habit, now);
    if (cost > 0) text += " · " + L.costLabels(habit).short + " " + L.formatCost(habit, now);
    return text;
  }

  function costSummaryText(habits, now) {
    var breakdown = L.costBreakdown(habits, now);
    var parts = [];
    if (breakdown.money > 0) parts.push("省下 " + L.formatMoney(breakdown.money));
    if (breakdown.hours > 0) parts.push("省回 " + L.formatCostValue(breakdown.hours, "time", "小时"));
    Object.keys(breakdown.custom).forEach(function (unit) {
      parts.push("少用 " + L.formatCostValue(breakdown.custom[unit], "custom", unit));
    });
    return parts.join(" · ");
  }

  function emptyHTML() {
    var presets = L.PRESETS.map(function (p) {
      return presetButtonHTML(p, 'data-act="new-habit" data-key="' + p.key + '"');
    }).join("");
    return (
      '<section class="card intro">' +
      "<h2>从一个坏习惯开始</h2>" +
      '<p class="muted">选一个你现在最想摆脱的。应用会帮你计时、记录冲动、算你省回了多少钱或多少时间。</p>' +
      '<div class="list">' + presets + "</div>" +
      '<p class="muted small">所有数据只保存在这台设备的浏览器里，不会上传到任何服务器。</p>' +
      "</section>"
    );
  }

  function sumTileHTML(label, value, sub) {
    return (
      '<div class="sum"><span class="k">' +
      esc(label) +
      '</span><span class="v">' +
      esc(value) +
      "</span>" +
      (sub ? '<span class="sub">' + esc(sub) + "</span>" : "") +
      "</div>"

  }

  function homeHTML() {
    var now = Date.now();
    if (!state.habits.length) return sloganHTML() + emptyHTML();
    var t = L.totals(state.habits, now);
    var line = ["正在戒断 " + t.count + " 项"];
    var cost = costSummaryText(state.habits, now);
    if (cost) line.push(cost);
    if (t.resisted > 0) line.push("扛住冲动 " + t.resisted + " 次");
    return (
      sloganHTML() +
      '<p class="muted small summary-line">' + esc(line.join(" · ")) + "</p>" +
      '<div class="rows">' +
      state.habits
        .map(function (habit) {
          return habitRowHTML(habit, now);
        })
        .join("") +
      "</div>" +
      '<button class="btn ghost wide" data-act="new-habit">+ 添加一个戒断目标</button>'
    );
  }

  var WEEKDAY_ROW = L.WEEKDAY_LABELS.map(function (w) {
    return "<span>" + w + "</span>";
  }).join("");

  var CAL_LEGEND =
    '<div class="legend">' +
    '<span><i class="sw sw-done"></i>打卡</span>' +
    '<span><i class="sw sw-urge"></i>有冲动</span>' +
    '<span><i class="sw sw-relapse"></i>破戒</span>' +
    '<span><i class="sw sw-none"></i>没记录</span>' +
    "</div>";

  var MONTH_NAMES = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];

  /* 月历：大号月份标题 + 周行 + 每天"数字 + 状态标记"。
     打卡的样式是"数字后面一个实心圆、日期反色"，所以日期永远不会被盖住。 */
  function monthCalendarHTML(habit, year, month, now) {
    var cells = L.monthGrid(habit, year, month, now);
    var todayKey = L.dayKey(now);
    /* 注意：这里保持成"每格一个字符串"的数组，
       按周切行时切数组，别切拼好的字符串（切字符串会把标签截断） */
    var dayCells = cells
      .map(function (cell) {
        if (cell.blank) return '<span class="day blank"></span>';

        var classes = ["day", cell.level];
        if (cell.key === todayKey) classes.push("today");
        if (ui.pulse && ui.pulse.id === habit.id && ui.pulse.key === cell.key) classes.push("pulse");

        var tip =
          cell.key +
          (cell.checkin ? " · 已打卡" : cell.future ? "" : " · 点一下打卡") +
          (cell.urges ? " · 冲动 " + cell.urges + " 次" : "") +
          (cell.relapses ? " · 破戒" : "");
        var attrs = cell.future
          ? ' disabled aria-label="' + esc(cell.key + "（还没到）") + '"'
          : ' data-act="toggle-day" data-id="' +
            habit.id +
            '" data-key="' +
            cell.key +
            '" aria-label="' +
            esc(cell.key + (cell.checkin ? " 已打卡，不能取消" : " 没打卡，点一下打卡")) +
            '"';

        return (
          '<button type="button" class="' +
          classes.join(" ") +
          '" title="' +
          esc(tip) +
          '"' +
          attrs +
          '><span class="day-num">' +
          cell.day +
          '</span><span class="day-mark"></span></button>'
        );
      });

    // 按周切行，方便画每周之间的细分隔线
    var weeks = "";
    for (var i = 0; i < dayCells.length; i += 7) {
      weeks += '<div class="cal-week">' + dayCells.slice(i, i + 7).join("") + "</div>";
    }

    return (
      '<div class="cal-head">' +
      '<button class="icon-btn" data-act="month-prev" aria-label="上个月">‹</button>' +
      '<span class="cal-year">' +
      year +
      " 年</span>" +
      '<button class="icon-btn" data-act="month-next" aria-label="下个月">›</button>' +
      '<button class="link-btn" data-act="month-now">回到本月</button>' +
      "</div>" +
      '<h2 class="cal-title">' +
      MONTH_NAMES[month] +
      "</h2>" +
      '<div class="cal-weekdays">' +
      WEEKDAY_ROW +
      "</div>" +
      '<div class="cal-weeks">' +
      weeks +
      "</div>"
    );
  }

  /* 兼容旧调用：详情页里也用它 */
  function monthGridHTML(habit, year, month, now) {
    return monthCalendarHTML(habit, year, month, now);
  }

  /* 年历里的迷你月（只看不点，整块点进去看那个月） */
  function miniMonthHTML(item) {
    var cells = item.cells
      .map(function (cell) {
        if (cell.blank) return '<span class="mini-day blank"></span>';
        var classes = ["mini-day"];
        if (cell.future) classes.push("future");
        if (cell.checkin) classes.push("done");
        if (cell.relapses) classes.push("relapse");
        else if (cell.urges) classes.push("urge");
        return '<span class="' + classes.join(" ") + '"><i>' + cell.day + "</i></span>";
      })
      .join("");
    return (
      '<button class="mini" data-act="goto-month" data-month="' +
      item.month +
      '"><span class="mini-label">' +
      item.label +
      '</span><span class="mini-cal">' +
      cells +
      "</span></button>"
    );
  }

  function habitSwitcherHTML() {
    if (state.habits.length < 2) return "";
    var current = currentHabit();
    return (
      '<div class="chips switcher">' +
      state.habits
        .map(function (habit) {
          return (
            '<button class="chip' +
            (current && habit.id === current.id ? " selected" : "") +
            '" data-act="pick-habit" data-id="' +
            habit.id +
            '">' +
            esc(habit.emoji + " " + habit.name) +
            "</button>"
          );
        })
        .join("") +
      "</div>"
    );

  function monthHTML() {
    var habit = currentHabit();
    if (!habit) return noHabitHTML();
    var now = Date.now();
    var cursor = cursorMonth();
    var stat = L.monthStats(habit, cursor.year, cursor.month, now);
    var ck = L.checkinStats(habit, now);
    var cost = L.costAccum(habit, now);
    var costText = cost > 0 ? L.costLabels(habit).short + " " + L.formatCost(habit, now) : "";
    var lines = ["打卡 " + stat.checkins + " 天"];
    if (cursor.year === L.currentMonth(now).year && cursor.month === L.currentMonth(now).month) lines.push("连续 " + ck.run + " 天");
    if (stat.relapses > 0) lines.push("破戒 " + stat.relapses + " 次");
    if (costText) lines.push(costText);
    var stamp = new Date(now);
    var quota = L.backfillQuota(habit, stamp.getFullYear(), stamp.getMonth());
    return (
      habitSwitcherHTML() +
      '<section class="card">' +
      monthCalendarHTML(habit, cursor.year, cursor.month, now) +
      CAL_LEGEND +
      '<p class="muted small">本月：' + esc(lines.join(" · ")) + "</p>" +
      '<p class="muted small">点没打卡的日子可以补上，<b>每月 ' +
      quota.limit +
      " 次</b>，本月还剩 <b>" +
      quota.left +
      "</b> 次；已打卡的日子不能取消，今天之后的日期点不了。</p>" +
      "</section>"
    );
  }

  function yearHTML() {
    var habit = currentHabit();
    if (!habit) return noHabitHTML();
    var now = Date.now();
    var year = cursorYear();
    var overview = L.yearOverview(habit, year, now);
    var ck = L.checkinStats(habit, now);
    var cost = L.costAccum(habit, now);
    /* 简洁版：没有卡片框，就是"年份 + 12 个迷你月 + 一行汇总" */
    var summary = ["全年打卡 " + overview.checkins + " 天", "最长连续 " + overview.longestRun + " 天"];
    if (overview.relapses > 0) summary.push("破戒 " + overview.relapses + " 次");
    if (cost > 0) summary.push(L.costLabels(habit).short + " " + L.formatCost(habit, now));
    return (
      habitSwitcherHTML() +
      '<section class="year-view">' +
      '<div class="year-head">' +
      '<button class="icon-btn" data-act="year-prev" aria-label="上一年">‹</button>' +
      '<h2 class="year-title">' +
      year +
      " 年</h2>" +
      '<button class="icon-btn" data-act="year-next" aria-label="下一年">›</button>' +
      "</div>" +
      '<div class="mini-grid">' +
      overview.months
        .map(function (item) {
          return miniMonthHTML(item);
        })
        .join("") +
      "</div>" +
      '<p class="muted small year-sum">' +
      esc(summary.join(" · ")) +
      " · 连续打卡 " +
      ck.run +
      " 天</p>" +
      '<div class="actions"><button class="link-btn" data-act="year-now">回到今年</button>' +
      '<span class="muted small">点某个月跳到那个月</span></div>' +
      "</section>"
    );
  }

  function noHabitHTML() {
    return (
      '<section class="card intro"><h2>还没有戒断目标</h2>' +
      '<p class="muted">先去「打卡」页添加一个，这里就会有它的记录。</p>' +
      '<div class="actions"><button class="btn primary" data-act="new-habit">添加戒断目标</button></div></section>'
    );

  function milestonesCompactHTML(habit, now) {
    var p = L.milestoneProgress(habit, now);
    var head =
      '<div class="progress-wrap">' +
      '<div class="progress"><div class="progress-bar" style="width:' + Math.round(p.progress * 100) + '%"></div></div>' +
      (p.next
        ? '<p class="muted small">下一个：<b>' + esc(p.next.title) + "</b> · " + esc(p.next.desc) + "<br>还有 " + L.formatDuration(p.remainingMs) + "</p>"
        : '<p class="muted small">所有里程碑都已达成。</p>') +
      "</div>";
    if (!ui.milestonesOpen) {
      return (
        '<section class="card"><h3>身体在发生什么</h3><p class="muted small">已达成 ' +
        p.reached.length +
        " / " +
        p.list.length +
        ' 个里程碑</p>' +
        head +
        '<div class="actions"><button class="btn ghost small-btn" data-act="toggle-milestones">查看全部</button></div></section>'
      );
    }
    var items = p.list
      .map(function (m) {
        var done = p.elapsed >= m.ms;
        var isNext = p.next && p.next.ms === m.ms;
        return (
          '<li class="' +
          (done ? "done" : isNext ? "next" : "todo") +
          '"><span class="dot">' +
          (done ? "✓" : "") +
          '</span><div class="ms-body"><b>' +
          esc(m.title) +
          "</b><span>" +
          esc(m.desc) +
          "</span></div></li>"
        );
      })
      .join("");
    return (
      '<section class="card"><h3>身体在发生什么</h3><p class="muted small">已达成 ' +
      p.reached.length +
      " / " +
      p.list.length +
      " 个里程碑</p>" +
      head +
      '<ul class="timeline">' +
      items +
      "</ul>" +
      '<div class="actions"><button class="btn ghost small-btn" data-act="toggle-milestones">收起</button></div></section>'
    );
  }

  function detailHTML(habit) {
    var now = Date.now();
    var stats = L.urgeStats(habit);
    var checked = L.isCheckedIn(habit, now);
    var ck = L.checkinStats(habit, now);
    var labels = L.costLabels(habit);
    var costType = L.costTypeOf(habit);
    var cost = L.costAccum(habit, now);
    var equivalent = L.timeEquivalent(cost, costType);
    var cursor = L.currentMonth(now);
    var monthStat = L.monthStats(habit, cursor.year, cursor.month, now);
    var stamp = new Date(now);
    var ckQuota = L.backfillQuota(habit, stamp.getFullYear(), stamp.getMonth());

    var costLine =
      '<section class="card cost-card">' +
      "<h3>" +
      esc(labels.long) +
      "</h3>" +
      (cost > 0
        ? '<p class="cost-value">' +
          esc(L.formatCost(habit, now)) +
          "</p>" +
          '<p class="muted small">按每天 ' +
          esc(L.formatCostValue(L.costPerDay(habit), costType, L.costUnit(habit))) +
          " 折算" +
          (equivalent ? "，" + esc(equivalent) : "") +
          "</p>"
        : '<p class="muted small">还没有设置每天的代价。</p>') +
      '<div class="actions"><button class="btn ghost small-btn" data-act="edit-habit" data-id="' +
      habit.id +
      '">改设置</button></div>' +
      "</section>";

    var facts = ["累计打卡 " + ck.total + " 天", "连续打卡 " + ck.run + " 天", "最长坚持 " + L.formatDuration(L.bestStreakMs(habit, now))];
    if (stats.resisted > 0) facts.push("扛住冲动 " + stats.resisted + " 次");
    if (habit.relapses.length) facts.push("破戒 " + habit.relapses.length + " 次");

    return (
      '<button class="back" data-act="nav" data-view="home">‹ 返回</button>' +
      '<section class="card hero">' +
      '<div class="hero-head"><span class="habit-emoji big">' + esc(habit.emoji) + "</span><div><h2>" + esc(habit.name) + "</h2>" +
      '<p class="muted small">' +
      (habit.reason ? esc(habit.reason) + " · " : "") +
      "从 " + dateTimeText(habit.cleanSince) + " 开始</p></div></div>" +
      '<div class="timer big" data-live="streak" data-id="' + habit.id + '">' + timerInner(habit, now) + "</div>" +
      '<div class="actions">' +
      '<button class="btn big-check ' + (checked ? "ok" : "primary") + '" data-act="toggle-checkin" data-id="' + habit.id + '">' +
      (checked ? "✓ 今天已打卡" : "今天打卡") +
      "</button>" +
      '<button class="btn warn" data-act="sos" data-id="' + habit.id + '">我有点想…</button>' +
      "</div>" +
      '<p class="muted small">' + esc(facts.join(" · ")) + "</p>" +
      "</section>" +
      costLine +
      '<section class="card"><h3>本月打卡</h3>' +
      monthGridHTML(habit, cursor.year, cursor.month, now) +
      CAL_LEGEND +
      '<p class="muted small">本月打卡 ' +
      monthStat.checkins +
      " 天" +
      (monthStat.relapses ? " · 破戒 " + monthStat.relapses + " 次" : "") +
      " · 补打卡本月还剩 " +
      ckQuota.left +
      " 次</p>" +
      '<div class="actions"><button class="btn ghost small-btn" data-act="nav" data-view="month" data-id="' + habit.id + '">看整月</button>' +
      '<button class="btn ghost small-btn" data-act="nav" data-view="year" data-id="' + habit.id + '">看全年</button></div>' +
      "</section>" +
      milestonesCompactHTML(habit, now) +
      '<section class="card danger-zone">' +
      "<h3>管理</h3>" +
      '<div class="actions">' +
      '<button class="btn ghost" data-act="edit-habit" data-id="' + habit.id + '">编辑</button>' +
      '<button class="btn ghost" data-act="open-relapse" data-id="' + habit.id + '">今天没守住</button>' +
      '<button class="btn danger" data-act="delete-habit" data-id="' + habit.id + '">删除</button>' +
      "</div></section>"
    );
  }

      esc(themeNames[state.theme] || "跟随系统") +

      "。</p></section>" +

      '<p class="muted small">首页每天轮换一句标语。你可以写自己的，它们会和内置标语一起出现，也会出现在冲动急救的呼吸引导里。</p>' +

      "</div></section>" +
      '<section class="card"><h3>关于</h3>' +
      '<p class="muted small">数据只保存在这台设备的浏览器里，不上传、不联网。清空浏览器数据会一并删掉记录，建议定期导出备份。</p>' +
      '<p class="muted small">提醒：这里的时间线来自公开的健康科普资料，仅供参考，不能替代医生的诊断和治疗建议。如果戒断时出现明显不适（比如严重心慌、手抖、出汗、幻觉），请及时就医。</p>' +
      "</section>"
    );

  function viewHTML() {
    if (state.view === "detail") {
      var habit = getHabit(state.activeId);
      if (habit) return detailHTML(habit);
    }
    if (state.view === "month") return monthHTML();
    if (state.view === "year") return yearHTML();
    if (state.view === "settings") return settingsHTML();
    return homeHTML();
  }

  function render(resetScroll) {
    var theme = resolvedTheme();
    document.documentElement.setAttribute("data-theme", theme);
    // 让手机状态栏的颜色跟着主题走，避免顶部出现一条对不上的色块
    var themeColor = document.getElementById("themeColor");
    if (themeColor) themeColor.setAttribute("content", theme === "light" ? "#f4f6fa" : "#0e1116");
    var statusBar = document.getElementById("statusBarStyle");
    if (statusBar) statusBar.setAttribute("content", theme === "light" ? "default" : "black-translucent");
    var y = window.scrollY;
    $("#app").innerHTML = topbarHTML() + '<main class="main">' + viewHTML() + "</main>" + tabbarHTML();
    setupTabbar();

    // 换页时内容错落着进场，方向跟着底部导航走
    var viewKey = state.view + ":" + (state.view === "detail" ? state.activeId || "" : "");
    var changed = viewKey !== ui.lastViewKey;
    ui.lastViewKey = viewKey;
    if ((changed || ui.forceAnim) && !reduceMotion()) {
      var main = $(".main");
      if (main) main.classList.add("anim-in");
    }
    ui.forceAnim = false;
    ui.pulse = null;
    ui.sloganAnim = false;

    // 底栏是刚重建的，让液态玻璃重新贴一次（没装 glass.js 也不会报错）
    if (window.LiquidGlass && window.LiquidGlass.refresh) window.LiquidGlass.refresh();

    window.scrollTo(0, resetScroll ? 0 : y);
  }

  /* ==================== 数据导入导出 ==================== */

  function exportData() {
    var payload = {
      app: "jieyin",
      version: 1,
      exportedAt: new Date().toISOString(),
      theme: state.theme,
      habits: state.habits
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = "jieyin-backup-" + L.dayKey(Date.now()) + ".json";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
    toast("备份已导出");
  }

  function importData() {
    var input = document.createElement("input");
    input.type = "file";
    input.accept = "application/json,.json";
    input.addEventListener("change", function () {
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var data;
        try {
          data = JSON.parse(String(reader.result));
        } catch (err) {
          toast("这个文件不是有效的备份");
          return;
        }
        if (!data || !Array.isArray(data.habits)) {
          toast("备份格式不对，缺少 habits 字段");
          return;
        }
        if (!window.confirm("导入会覆盖当前所有记录，确定继续吗？")) return;
        state.habits = data.habits.map(normalizeHabit);
        state.activeId = state.habits.length ? state.habits[0].id : null;
        state.view = "home";
        save();
        render(true);
        toast("已恢复 " + state.habits.length + " 个目标");
      };
      reader.readAsText(file);
    });
    input.click();
  }

  function clearAll() {
    if (!window.confirm("确定要清空所有记录吗？这个操作无法撤销，建议先导出备份。")) return;
    if (!window.confirm("再确认一次：所有戒断计时、冲动与复吸记录都会被删除。")) return;
    state = emptyState();
    save();
    render(true);
    toast("已清空");
  }

  /* ==================== 事件 ==================== */

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");
    var id = el.getAttribute("data-id");

    if (act === "nav") {
      // 刚刚是用拖的，别让抬手时那次点击又跳一次
      if (ui.suppressTabClick && Date.now() < ui.suppressTabClick && el.classList.contains("tab-btn")) return;
      if (el.classList.contains("tab-btn")) tapFeedback();
      goTo(el.getAttribute("data-view"), el.getAttribute("data-view") === "detail" ? id : undefined);
      return;
    }
    if (act === "theme") {
      state.theme = el.getAttribute("data-value") || "system";
      save();
      render();
      return;
    }
    if (act === "new-habit") {
      if ($(".overlay")) return; // 已经有弹窗开着，别叠第二层
      var presetKey = el.getAttribute("data-key");
      if (presetKey) openHabitForm(null, presetKey);
      else openPresetPicker();
      return;
    }
    if (act === "edit-habit") {
      openHabitForm(id);
      return;
    }
    if (act === "open-habit") {
      goTo("detail", id);
      return;
    }
    if (act === "toggle-checkin") {
      toggleCheckin(id);
      return;
    }
    if (act === "toggle-day") {
      toggleDay(id, el.getAttribute("data-key"));
      return;
    }
    if (act === "next-slogan") {
      ui.sloganOffset += 1;
      ui.sloganAnim = true;
      render();
      return;
    }
    if (act === "pick-habit") {
      state.activeId = id;
      save();
      render();
      return;
    }
    if (act === "month-prev" || act === "month-next") {
      var step = act === "month-prev" ? -1 : 1;
      ui.monthCursor = L.shiftMonth(cursorMonth().year, cursorMonth().month, step);
      render(true);
      return;
    }
    if (act === "month-now") {
      ui.monthCursor = null;
      render(true);
      return;
    }
    if (act === "year-prev" || act === "year-next") {
      ui.yearCursor = cursorYear() + (act === "year-prev" ? -1 : 1);
      render(true);
      return;
    }
    if (act === "year-now") {
      ui.yearCursor = null;
      render(true);
      return;
    }
    if (act === "goto-month") {
      ui.monthCursor = { year: cursorYear(), month: Number(el.getAttribute("data-month")) };
      goTo("month");
      return;
    }
    if (act === "toggle-milestones") {
      ui.milestonesOpen = !ui.milestonesOpen;
      render();
      return;
    }
    if (act === "manage-slogans") {
      openSloganManager();
      return;
    }
    if (act === "sos") {
      openSOS(id);
      return;
    }
    if (act === "open-relapse") {
      openRelapse(id);
      return;
    }
    if (act === "delete-habit") {
      var habit = getHabit(id);
      if (habit && window.confirm("删除「" + habit.name + "」？所有计时与记录都会一起消失。")) deleteHabit(id);
      return;
    }
    if (act === "export") {
      exportData();
      return;
    }
    if (act === "import") {
      importData();
      return;
    }
    if (act === "clear") {
      clearAll();
      return;
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeTopModal();
  });

  var lastDayKey = L.dayKey(Date.now());
  if (systemTheme) {
    var onSystemThemeChange = function () {
      if (state.theme === "system") render();
    };
    if (systemTheme.addEventListener) systemTheme.addEventListener("change", onSystemThemeChange);
    else if (systemTheme.addListener) systemTheme.addListener(onSystemThemeChange);
  }

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var bar = $(".tabbar");
      if (bar && bar.__sync) bar.__sync();
    }, 150);
  });

  /* 每秒只更新两个文本节点，成本很低；但页面不可见时没必要跑，
     所以切到后台就停掉计时器，回到前台立刻补一次再继续。 */
  function tick() {
    var now = Date.now();
    if (L.dayKey(now) !== lastDayKey) {
      lastDayKey = L.dayKey(now);
      render();
      return;
    }
    $$('[data-live="streak"]').forEach(function (el) {
      var habit = getHabit(el.getAttribute("data-id"));
      if (habit) el.innerHTML = timerInner(habit, now);
    });
    $$('[data-live="streak-text"]').forEach(function (el) {
      var habit = getHabit(el.getAttribute("data-id"));
      if (habit) el.textContent = habitSubText(habit, now);
    });
  }

  var tickTimer = null;
  function startTick() {
    if (tickTimer === null) tickTimer = setInterval(tick, 1000);
  }
  function stopTick() {
    if (tickTimer !== null) {
      clearInterval(tickTimer);
      tickTimer = null;
    }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      stopTick();
    } else {
      tick();
      startTick();
    }
  });
  startTick();

  render(true);
})();

</script>
  </body>
</html>
